<meta name="theme-color" content="#211F45">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --lav1:#CFCBEC; --lav2:#E7E4F7; --dark:#211F45; --dark2:#2C295E;
  --glass:rgba(255,255,255,.6); --ink:#211F45; --muted:#7A76A0;
  --amber1:#F6B26B; --amber2:#C97A2E; --rose1:#F0A6C7; --rose2:#C9527E; --teal1:#6FD3C7; --teal2:#2E8C82;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0; min-height:100%; background:linear-gradient(160deg,var(--lav1),var(--lav2)); color:var(--ink); font-family:"Cairo",Tahoma,Arial,sans-serif;}
.wrap{max-width:430px; margin:0 auto; padding-top:env(safe-area-inset-top,0px);}

.topbar{background:linear-gradient(160deg,var(--dark),var(--dark2)); border-radius:0 0 30px 30px; padding:20px 22px 46px; display:flex; align-items:center; justify-content:space-between;}
.topbar .ic{width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center;}
.topbar .ic svg{width:16px; height:16px; fill:#fff;}

.searchpill{
  background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-radius:20px; margin:-28px 20px 0; padding:13px 18px; display:flex; align-items:center; gap:10px;
  box-shadow:0 10px 26px -12px rgba(33,31,69,.35); position:relative; z-index:2;
}
.searchpill span{color:var(--muted); font-size:13px;}

.promo{
  background:linear-gradient(160deg,var(--dark2),var(--dark)); border-radius:22px; margin:14px 20px -20px;
  padding:20px 20px 34px; color:#fff; position:relative; z-index:1;
}
.promo .row{display:flex; align-items:center; gap:12px;}
.promo .icbox{width:46px; height:46px; border-radius:13px; background:linear-gradient(135deg,#F6B26B,#C9527E); display:flex; align-items:center; justify-content:center;}
.promo .icbox svg{width:22px; height:22px; fill:#fff;}
.promo h2{font-size:15px; margin:0;}
.promo p{font-size:11.5px; color:#c7c3e6; margin:2px 0 0;}
.promo .bar{height:5px; background:rgba(255,255,255,.15); border-radius:6px; margin-top:16px; overflow:hidden;}
.promo .bar span{display:block; height:100%; width:65%; background:linear-gradient(90deg,#F6B26B,#F0A6C7); border-radius:6px;}
.promo .meta{display:flex; justify-content:space-between; font-size:10.5px; color:#a9a4d1; margin-top:6px;}

.sheet{background:var(--lav2); border-radius:26px 26px 0 0; padding:34px 20px 10px; position:relative; z-index:0;}
.section-title{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); margin-bottom:14px;}
.tabs{display:flex; gap:8px; margin-bottom:16px;}
.tabs button{background:#fff; border:none; color:var(--muted); font-size:12px; padding:6px 14px; border-radius:14px; cursor:pointer; font-family:"Cairo"; box-shadow:0 4px 10px -6px rgba(33,31,69,.2);}
.tabs button.active{background:var(--dark); color:#fff;}

.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px 10px; padding-bottom:8px;}
.product{text-align:center; cursor:pointer;}
.icbox2{width:100%; aspect-ratio:1; border-radius:16px; display:flex; align-items:center; justify-content:center; margin-bottom:6px; box-shadow:0 8px 16px -8px rgba(33,31,69,.35); position:relative;}
.icbox2.شرقي{background:linear-gradient(145deg,var(--amber1),var(--amber2));}
.icbox2.نسائي{background:linear-gradient(145deg,var(--rose1),var(--rose2));}
.icbox2.رجالي{background:linear-gradient(145deg,var(--teal1),var(--teal2));}
.icbox2 svg{width:46%; height:46%;}
.icbox2 .views{position:absolute; top:4px; left:4px; background:rgba(0,0,0,.25); color:#fff; font-size:8px; padding:1px 5px; border-radius:8px;}
.product h3{font-size:11px; margin:0; font-weight:700;}
.product .price{font-size:10.5px; color:var(--muted);}

.bottombar{background:linear-gradient(160deg,var(--dark),var(--dark2)); border-radius:26px 26px 0 0; margin-top:10px; padding:26px 20px 20px; position:relative;}
.fab{
  position:absolute; top:-26px; left:50%; transform:translateX(-50%);
  width:56px; height:56px; border-radius:50%; background:linear-gradient(145deg,#F6B26B,#C9527E);
  display:flex; align-items:center; justify-content:center; border:4px solid var(--lav2); cursor:pointer;
}
.fab svg{width:22px; height:22px; fill:#fff;}
#cartCount{position:absolute; top:-4px; left:-4px; background:#fff; color:var(--dark); border-radius:50%; width:17px; height:17px; font-size:9px; display:flex; align-items:center; justify-content:center; font-weight:700;}
.navrow{display:flex; justify-content:space-around; margin-top:24px;}
.navrow .n{width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center;}
.navrow .n svg{width:14px; height:14px; fill:#c7c3e6;}
.social{display:flex; justify-content:center; gap:12px; margin-top:16px;}
.social a{width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; text-decoration:none;}
.social a svg{width:13px; height:13px; fill:#c7c3e6;}

.overlay{position:fixed; inset:0; background:rgba(33,31,69,.6); display:none; z-index:45; align-items:center; justify-content:center;}
.overlay.show{display:flex;}
.modal{background:#fff; border-radius:22px; padding:26px 22px; width:85%; max-width:340px; text-align:center;}
.modal h2{font-size:18px; margin:0 0 6px; color:var(--dark);}
.modal p{color:var(--muted); font-size:13px; margin:0 0 16px;}
.modal input{width:100%; padding:12px; border:1px solid #eee; border-radius:12px; background:#f7f6fb; color:var(--ink); font-size:14px; margin-bottom:14px; text-align:center; font-family:"Cairo";}
.modal button{width:100%; background:var(--dark); color:#fff; border:none; border-radius:12px; padding:12px; font-weight:700; cursor:pointer; font-size:14px; font-family:"Cairo";}

#drawer{position:fixed; top:0; bottom:0; left:0; width:88%; max-width:360px; background:#fff; z-index:31; transform:translateX(-100%); transition:transform .25s; display:flex; flex-direction:column; border-radius:0 26px 26px 0; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
#drawer.open{transform:translateX(0);}
.drawer-head{display:flex; justify-content:space-between; align-items:center; padding:18px 20px; border-bottom:1px solid #eee;}
.drawer-head strong{color:var(--dark); font-size:16px;}
.drawer-head button{background:#f2f1f8; border:none; width:30px; height:30px; border-radius:50%; font-size:15px; color:var(--dark); cursor:pointer;}
#cartItems{flex:1; overflow-y:auto; padding:10px 20px;}
.cart-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #f0eff6; font-size:14px;}
.cart-row .qty{display:flex; align-items:center; gap:8px;}
.cart-row .qty button{width:26px; height:26px; border:none; background:#f2f1f8; color:var(--dark); border-radius:8px; cursor:pointer;}
.drawer-foot{padding:18px 20px;}
.total{display:flex; justify-content:space-between; font-weight:800; margin-bottom:14px; color:var(--dark); font-size:16px;}
#checkoutBtn{width:100%; padding:13px; background:#25D366; color:#fff; border:none; border-radius:14px; font-size:15px; cursor:pointer; font-weight:700;}
.empty{color:var(--muted); text-align:center; padding:40px 0; font-size:14px;}

.reelsView{position:fixed; inset:0; z-index:40; background:#000; display:none;}
.reelsView.show{display:block;}
.reel-scroll{height:100%; overflow-y:scroll; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch;}
.reel-item{height:100%; scroll-snap-align:start; position:relative; display:flex; align-items:flex-end; overflow:hidden;}
.reel-item .center-ic{position:absolute; top:42%; left:50%; transform:translate(-50%,-50%); width:110px; height:110px; opacity:.95;}
.reel-close{position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); left:16px; z-index:42; background:rgba(255,255,255,.15); border:none; color:#fff; width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer;}
.reel-actions{position:absolute; left:14px; bottom:110px; display:flex; flex-direction:column; gap:20px; align-items:center; z-index:1;}
.reel-actions .a{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:#fff;}
.reel-actions svg{width:25px; height:25px; fill:#fff;}
.reel-caption{position:relative; z-index:1; padding:16px 70px 40px 18px; color:#fff; width:100%;}
.reel-caption h4{margin:0 0 4px; font-size:15px;}
.reel-caption p{margin:0 0 10px; font-size:12px; opacity:.85;}
.reel-caption button{background:#fff; color:var(--dark); border:none; padding:7px 16px; border-radius:16px; font-size:12px; font-weight:700; cursor:pointer; font-family:"Cairo";}
.navrow .n.reel-tab{width:auto; height:auto; background:none; flex-direction:column; gap:4px; padding:0;}
.navrow .n.reel-tab .circle{width:40px; height:40px; border-radius:50%; background:linear-gradient(145deg,#F6B26B,#C9527E); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 14px -4px rgba(201,82,126,.6);}
.navrow .n.reel-tab .circle svg{width:18px; height:18px;}
.navrow .n.reel-tab span{color:#fff; font-size:10px; font-weight:700;}
.reel-store-btn{position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); left:16px; z-index:42; background:rgba(255,255,255,.9); border:none; color:var(--dark); padding:8px 16px; border-radius:20px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:"Cairo"; display:flex; align-items:center; gap:6px;}
</style>
</head>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAcLn9b8i6e40pIS6gE8Ex5xXv78hBlPvA",
  authDomain: "dukan-jaafar.firebaseapp.com",
  projectId: "dukan-jaafar",
  storageBucket: "dukan-jaafar.firebasestorage.app",
  messagingSenderId: "179580937604",
  appId: "1:179580937604:web:81325223522d42e2b6e9d1",
  measurementId: "G-EJLJR930EP"
};

const products = [
  {id:"1", name:"عود ملكي", cat:"شرقي", price:45},
  {id:"2", name:"ياسمين الليل", cat:"نسائي", price:38},
  {id:"3", name:"مسك أبيض", cat:"شرقي", price:32},
  {id:"4", name:"بلو أوشن", cat:"رجالي", price:40},
  {id:"5", name:"عنبر ذهبي", cat:"شرقي", price:50},
  {id:"6", name:"فانيليا كريمية", cat:"نسائي", price:35},
  {id:"7", name:"وود أسود", cat:"رجالي", price:42},
  {id:"8", name:"زهر البرتقال", cat:"نسائي", price:30},
];
const categories = ["الكل","شرقي","نسائي","رجالي"];
let activeCat = "الكل";
let cart = {};
let viewCounts = {};
let pendingOrderMsg = "";
const VIP_THRESHOLD = 150;

let db=null, uid=null, profileRef=null;

async function initBackend(){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }catch(e){ db=null; console.error('تعذر الاتصال بـ Firebase:', e); }

  uid = localStorage.getItem("guestId");
  if(!uid){ uid = "g_"+Math.random().toString(36).slice(2); localStorage.setItem("guestId", uid); }

  if(db && uid){
    profileRef = db.doc(`data/users/${uid}/profile`);
    try{
      const snap = await profileRef.get();
      if(snap.exists && snap.data().name) applyProfile(snap.data());
      else document.getElementById('nameOverlay').classList.add('show');
    }catch(e){ document.getElementById('nameOverlay').classList.add('show'); }
  } else {
    const saved = JSON.parse(localStorage.getItem('profile')||'null');
    if(saved && saved.name) applyProfile(saved);
    else document.getElementById('nameOverlay').classList.add('show');
  }
  loadViews();
}
function applyProfile(p){
  const tier = (p.totalSpent||0) >= VIP_THRESHOLD ? "VIP" : "زبون";
  document.getElementById('userChip').textContent = `${p.name} · ${tier}`;
}
document.getElementById('saveNameBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('nameInput').value.trim();
  if(!name) return;
  const profile = {name, totalSpent:0, createdAt:Date.now()};
  if(db && profileRef){ try{ await profileRef.set(profile); }catch(e){} }
  else localStorage.setItem('profile', JSON.stringify(profile));
  applyProfile(profile);
  document.getElementById('nameOverlay').classList.remove('show');
});
async function loadViews(){
  if(!db) return;
  try{ const snap = await db.collection('products').get(); snap.docs.forEach(d=>{ viewCounts[d.id]=d.data().views||0; }); }catch(e){}
  renderGrid();
}
async function registerView(id){
  if(!db){ viewCounts[id]=(viewCounts[id]||0)+1; return; }
  try{
    const ref = db.collection('products').doc(id);
    const snap = await ref.get();
    const current = snap.exists ? (snap.data().views||0) : 0;
    await ref.set({views: current+1});
    viewCounts[id] = current+1;
  }catch(e){}
}

const filtersEl = document.getElementById('filters');
const gridEl = document.getElementById('grid');
function renderFilters(){
  filtersEl.innerHTML = categories.map(c=>`<button data-cat="${c}" class="${c===activeCat?'active':''}">${c}</button>`).join('');
}
function bottleIcon(){
  return `<svg viewBox="0 0 24 24" fill="#fff"><path d="M10 2h4v3h-4z"/><path d="M8 7h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z" opacity=".95"/></svg>`;
}
function renderGrid(){
  const list = activeCat==="الكل" ? products : products.filter(p=>p.cat===activeCat);
  gridEl.innerHTML = list.map(p=>`
    <div class="product" data-add="${p.id}">
      <div class="icbox2 ${p.cat}"><span class="views">${viewCounts[p.id]||0}</span>${bottleIcon()}</div>
      <h3>${p.name}</h3>
      <div class="price">$${p.price}</div>
    </div>
  `).join('');
}
function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function cartTotal(){ return Object.entries(cart).reduce((s,[id,q])=>s+products.find(p=>p.id===id).price*q,0); }
function renderCart(){
  document.getElementById('cartCount').textContent = cartCount();
  const items = Object.entries(cart);
  const el = document.getElementById('cartItems');
  el.innerHTML = items.length===0 ? '<div class="empty">السلة فارغة</div>' : items.map(([id,q])=>{
    const p = products.find(pr=>pr.id===id);
    return `<div class="cart-row"><span>${p.name}</span><div class="qty"><button data-dec="${id}">−</button><span>${q}</span><button data-inc="${id}">+</button></div></div>`;
  }).join('');
  document.getElementById('totalPrice').textContent = `$${cartTotal()}`;
}
function changeQty(id,d){ cart[id]=(cart[id]||0)+d; if(cart[id]<=0) delete cart[id]; renderCart(); }

const reelCaptions = {
  "1":"رائحة ملكية تدوم طوال اليوم ✨",
  "2":"لمسة أنثوية ناعمة تحت ضوء القمر 🌙",
  "3":"نقاء وأناقة في كل رشة",
  "4":"انتعاش يرافقك من الصبح للمسا 🌊",
  "5":"دفء العنبر بلمسة ذهبية",
  "6":"حلاوة الفانيليا بقوام كريمي",
  "7":"قوة وثقة برائحة الخشب الأسود",
  "8":"إشراقة الحمضيات في كل خطوة 🍊",
};
function renderReels(){
  document.getElementById('reelScroll').innerHTML = products.map(p=>`
    <div class="reel-item ${p.cat}" style="background:linear-gradient(160deg,var(--${p.cat==='شرقي'?'amber1':p.cat==='نسائي'?'rose1':'teal1'}),var(--${p.cat==='شرقي'?'amber2':p.cat==='نسائي'?'rose2':'teal2'}))">
      <div class="center-ic">${bottleIcon().replace('fill="#fff"','fill="#fff" opacity=".9"')}</div>
      <div class="reel-actions">
        <div class="a"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-9.5-9C.8 8.4 3 5 6.5 5 9 5 11 7 12 8.5 13 7 15 5 17.5 5 21 5 23.2 8.4 21.5 12 19 16.6 12 21 12 21z"/></svg><span>${120+Number(p.id)*17}</span></div>
        <div class="a"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H7l-3 3z"/></svg><span>${8+Number(p.id)}</span></div>
        <div class="a"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2-6z"/></svg><span>مشاركة</span></div>
      </div>
      <div class="reel-caption">
        <h4>${p.name}</h4>
        <p>${reelCaptions[p.id]||''}</p>
        <button data-reel-add="${p.id}">أضف للسلة · $${p.price}</button>
      </div>
    </div>
  `).join('');
}
document.getElementById('openReels').addEventListener('click', ()=>{
  renderReels();
  document.getElementById('reelsView').classList.add('show');
});
document.getElementById('closeReels').addEventListener('click', ()=>{
  document.getElementById('reelsView').classList.remove('show');
});
document.getElementById('reelScroll').addEventListener('click', e=>{
  const b = e.target.closest('[data-reel-add]'); if(!b) return;
  const id = b.dataset.reelAdd;
  cart[id]=(cart[id]||0)+1; renderCart(); registerView(id);
  b.textContent = 'أُضيف ✓';
  setTimeout(()=>{ b.textContent = `أضف للسلة · $${products.find(p=>p.id===id).price}`; }, 1200);
});

renderFilters(); renderGrid(); renderCart(); initBackend();
renderReels();
document.getElementById('reelsView').classList.add('show');

filtersEl.addEventListener('click', e=>{
  const b = e.target.closest('button[data-cat]'); if(!b) return;
  activeCat = b.dataset.cat; renderFilters(); renderGrid();
});
gridEl.addEventListener('click', e=>{
  const p = e.target.closest('[data-add]'); if(!p) return;
  const id = p.dataset.add;
  cart[id]=(cart[id]||0)+1; renderCart(); registerView(id);
});
document.getElementById('cartBtn').addEventListener('click', ()=>{
  document.getElementById('drawer').classList.add('open');
  document.getElementById('cartOverlay').classList.add('show');
});
function closeCart(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('cartOverlay').classList.remove('show');
}
document.getElementById('closeDrawer').addEventListener('click', closeCart);
document.getElementById('cartOverlay').addEventListener('click', closeCart);
document.getElementById('cartItems').addEventListener('click', e=>{
  const inc = e.target.closest('button[data-inc]'); const dec = e.target.closest('button[data-dec]');
  if(inc) changeQty(inc.dataset.inc,1); if(dec) changeQty(dec.dataset.dec,-1);
});
document.getElementById('checkoutBtn').addEventListener('click', async ()=>{
  const items = Object.entries(cart);
  if(items.length===0){ alert('السلة فارغة!'); return; }
  let msg = "مرحبا، بدي أطلب:\n";
  items.forEach(([id,q])=>{ const p=products.find(pr=>pr.id===id); msg += `- ${p.name} × ${q} = $${p.price*q}\n`; });
  const total = cartTotal();
  msg += `\nالإجمالي: $${total}`;
  try{
    if(db && profileRef){
      await profileRef.collection('orders').add({items:cart, total, createdAt:Date.now()});
      const snap = await profileRef.get();
      const newTotal = (snap.data().totalSpent||0) + total;
      await profileRef.set({...snap.data(), totalSpent:newTotal});
      applyProfile({...snap.data(), totalSpent:newTotal});
    } else {
      const p = JSON.parse(localStorage.getItem('profile')||'{}');
      p.totalSpent = (p.totalSpent||0) + total;
      localStorage.setItem('profile', JSON.stringify(p));
      applyProfile(p);
    }
  }catch(e){}
  pendingOrderMsg = msg;
  document.getElementById('waOverlay').classList.add('show');
});
document.getElementById('socialWaBtn').addEventListener('click', (e)=>{
  e.preventDefault();
  pendingOrderMsg = "مرحبا، عندي استفسار بخصوص دُكَّان جهفر";
  document.getElementById('waOverlay').classList.add('show');
});
document.querySelectorAll('.wa-choice').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const num = btn.dataset.num;
    document.getElementById('waOverlay').classList.remove('show');
    window.open(`https://wa.me/${num}?text=${encodeURIComponent(pendingOrderMsg)}`, '_blank');
  });
});
document.getElementById('waOverlay').addEventListener('click', (e)=>{
  if(e.target.id==='waOverlay') document.getElementById('waOverlay').classList.remove('show');
});
</script>
</body>
</html>
