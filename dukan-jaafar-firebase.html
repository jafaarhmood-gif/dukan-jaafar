<style>
:root{
  --lav1:#CFCBEC; --lav2:#E7E4F7; --dark:#211F45; --dark2:#2C295E;
  --glass:rgba(255,255,255,.6); --ink:#211F45; --muted:#7A76A0;
  --amber1:#F6B26B; --amber2:#C97A2E; --rose1:#F0A6C7; --rose2:#C9527E; --teal1:#6FD3C7; --teal2:#2E8C82;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0; min-height:100%; background:linear-gradient(160deg,var(--lav1),var(--lav2)); color:var(--ink); font-family:"Cairo",Tahoma,Arial,sans-serif;}
.wrap{max-width:430px; margin:0 auto; padding-top:env(safe-area-inset-top,0px);}

.topbar{background:linear-gradient(160deg,var(--dark),var(--dark2)); border-radius:0 0 30px 30px; padding:20px 22px 46px; display:flex; align-items:center; justify-content:space-between;}
.topbar .ic{width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center;}
.topbar .ic svg{width:16px; height:16px; fill:#fff;}

.searchpill{
  background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-radius:20px; margin:-28px 20px 0; padding:13px 18px; display:flex; align-items:center; gap:10px;
  box-shadow:0 10px 26px -12px rgba(33,31,69,.35); position:relative; z-index:2;
}
.searchpill span{color:var(--muted); font-size:13px;}

.promo{
  background:linear-gradient(160deg,var(--dark2),var(--dark)); border-radius:22px; margin:14px 20px -20px;
  padding:20px 20px 34px; color:#fff; position:relative; z-index:1;
}
.promo .row{display:flex; align-items:center; gap:12px;}
.promo .icbox{width:46px; height:46px; border-radius:13px; background:linear-gradient(135deg,#F6B26B,#C9527E); display:flex; align-items:center; justify-content:center;}
.promo .icbox svg{width:22px; height:22px; fill:#fff;}
.promo h2{font-size:15px; margin:0;}
.promo p{font-size:11.5px; color:#c7c3e6; margin:2px 0 0;}
.promo .bar{height:5px; background:rgba(255,255,255,.15); border-radius:6px; margin-top:16px; overflow:hidden;}
.promo .bar span{display:block; height:100%; width:65%; background:linear-gradient(90deg,#F6B26B,#F0A6C7); border-radius:6px;}
.promo .meta{display:flex; justify-content:space-between; font-size:10.5px; color:#a9a4d1; margin-top:6px;}
.trust-row{display:flex; gap:8px; margin:14px 20px 0; position:relative; z-index:1;}
.trust-item{flex:1; background:#fff; border-radius:14px; padding:10px 6px; text-align:center; box-shadow:0 6px 14px -10px rgba(33,31,69,.3);}
.trust-item svg{width:20px; height:20px; margin-bottom:4px;}
.trust-item span{display:block; font-size:9.5px; color:var(--dark); font-weight:700; line-height:1.3;}
.badge-best{position:absolute; top:6px; right:6px; z-index:2; background:linear-gradient(135deg,#E9C46A,#B8860B); color:#211F45; font-size:8.5px; font-weight:800; padding:3px 8px; border-radius:8px; box-shadow:0 3px 8px -2px rgba(184,134,11,.6);}
.badge-new{position:absolute; top:6px; right:6px; z-index:2; background:var(--dark); color:#fff; font-size:8.5px; font-weight:800; padding:3px 8px; border-radius:8px;}

.sheet{background:var(--lav2); border-radius:26px 26px 0 0; padding:34px 20px 10px; position:relative; z-index:0;}
.section-title{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); margin-bottom:14px;}
.tabs{display:flex; gap:8px; margin-bottom:16px;}
.tabs button{background:#fff; border:none; color:var(--muted); font-size:12px; padding:6px 14px; border-radius:14px; cursor:pointer; font-family:"Cairo"; box-shadow:0 4px 10px -6px rgba(33,31,69,.2);}
.tabs button.active{background:var(--dark); color:#fff;}

.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px 10px; padding-bottom:8px;}
.product{text-align:center; cursor:pointer;}
.stock-badge{font-size:10px; color:var(--muted); margin-top:2px;}
.product.out-of-stock{opacity:.45; pointer-events:none;}
.product.out-of-stock .stock-badge{color:#c94747; font-weight:700;}
.icbox2{width:100%; aspect-ratio:1; border-radius:16px; display:flex; align-items:center; justify-content:center; margin-bottom:6px; box-shadow:0 8px 16px -8px rgba(33,31,69,.35); position:relative;}
.icbox2.شرقي{background:linear-gradient(145deg,var(--amber1),var(--amber2));}
.icbox2.نسائي{background:linear-gradient(145deg,var(--rose1),var(--rose2));}
.icbox2.رجالي{background:linear-gradient(145deg,var(--teal1),var(--teal2));}
.icbox2 svg{width:46%; height:46%;}
.icbox2 .views{position:absolute; top:4px; left:4px; background:rgba(0,0,0,.25); color:#fff; font-size:8px; padding:1px 5px; border-radius:8px;}
.product h3{font-size:11px; margin:0; font-weight:700;}
.product .price{font-size:10.5px; color:var(--muted);}

.bottombar{background:linear-gradient(160deg,var(--dark),var(--dark2)); border-radius:26px 26px 0 0; margin-top:10px; padding:26px 20px 20px; position:relative;}
.fab{
  position:absolute; top:-26px; left:50%; transform:translateX(-50%);
  width:56px; height:56px; border-radius:50%; background:linear-gradient(145deg,#F6B26B,#C9527E);
  display:flex; align-items:center; justify-content:center; border:4px solid var(--lav2); cursor:pointer;
}
.fab svg{width:22px; height:22px; fill:#fff;}
#cartCount{position:absolute; top:-4px; left:-4px; background:#fff; color:var(--dark); border-radius:50%; width:17px; height:17px; font-size:9px; display:flex; align-items:center; justify-content:center; font-weight:700;}
.navrow{display:flex; justify-content:space-around; margin-top:24px;}
.navrow .n{width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center;}
.navrow .n svg{width:14px; height:14px; fill:#c7c3e6;}
.social{display:flex; justify-content:center; gap:12px; margin-top:16px;}
.social a{width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; text-decoration:none;}
.social a svg{width:13px; height:13px; fill:#c7c3e6;}

.overlay{position:fixed; inset:0; background:rgba(33,31,69,.6); display:none; z-index:45; align-items:center; justify-content:center;}
.overlay.show{display:flex;}
/* عتم خلفية لوحتي الحساب والتعليقات لازم يكون تحت اللوحة نفسها (z-index أقل)
   وإلا العتم يبلع كل ضغطة، حتى الضغط على مربع كتابة التعليق، ويسكر اللوحة بدل ما يفتح الكيبورد */
#accountOverlay, #commentsOverlay{ z-index:40; }
/* لوحة السلة (#drawer) نفسها z-index:31، فلازم عتمتها تكون أوطى منها (30) مب 45 */
#cartOverlay{ z-index:30; }
.modal{background:#fff; border-radius:22px; padding:26px 22px; width:85%; max-width:340px; text-align:center;}
.modal h2{font-size:18px; margin:0 0 6px; color:var(--dark);}
.modal p{color:var(--muted); font-size:13px; margin:0 0 16px;}
.modal input{width:100%; padding:12px; border:1px solid #eee; border-radius:12px; background:#f7f6fb; color:var(--ink); font-size:14px; margin-bottom:14px; text-align:center; font-family:"Cairo";}
.modal button{width:100%; background:var(--dark); color:#fff; border:none; border-radius:12px; padding:12px; font-weight:700; cursor:pointer; font-size:14px; font-family:"Cairo";}

#nameOverlay .modal h2{color:#fff;}
#nameOverlay .modal p{color:#e9e4ff;}
#nameOverlay .modal input{background:rgba(255,255,255,.95);}
#nameOverlay .modal button{background:linear-gradient(135deg,#E9C46A,#B8860B); color:#211F45;}

#drawer{position:fixed; top:0; bottom:0; left:0; width:88%; max-width:360px; background:#fff; z-index:31; transform:translateX(-100%); transition:transform .25s; display:flex; flex-direction:column; border-radius:0 26px 26px 0; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
#drawer.open{transform:translateX(0);}
.drawer-head{display:flex; justify-content:space-between; align-items:center; padding:18px 20px; border-bottom:1px solid #eee;}
.drawer-head strong{color:var(--dark); font-size:16px;}
.drawer-head button{background:#f2f1f8; border:none; width:30px; height:30px; border-radius:50%; font-size:15px; color:var(--dark); cursor:pointer;}
#cartItems{flex:1; overflow-y:auto; padding:10px 20px;}
.cart-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #f0eff6; font-size:14px;}
.cart-row .qty{display:flex; align-items:center; gap:8px;}
.cart-row .qty button{width:26px; height:26px; border:none; background:#f2f1f8; color:var(--dark); border-radius:8px; cursor:pointer;}
.drawer-foot{padding:18px 20px;}
.total{display:flex; justify-content:space-between; font-weight:800; margin-bottom:14px; color:var(--dark); font-size:16px;}
#checkoutBtn{width:100%; padding:13px; background:#25D366; color:#fff; border:none; border-radius:14px; font-size:15px; cursor:pointer; font-weight:700;}
.empty{color:var(--muted); text-align:center; padding:40px 0; font-size:14px;}
.retryBtn{margin-top:14px; background:var(--dark); color:#fff; border:none; padding:10px 22px; border-radius:20px; font-size:13px; font-weight:700;}

#accountPanel, #commentsPanel{position:fixed; top:0; bottom:0; left:0; width:88%; max-width:360px; background:#fff; z-index:41; transform:translateX(-100%); transition:transform .25s; display:flex; flex-direction:column; border-radius:0 26px 26px 0; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
#accountPanel.open, #commentsPanel.open{transform:translateX(0);}
#accountBody{flex:1; overflow-y:auto; padding:14px 20px;}
.acct-head{text-align:center; padding:10px 0 18px;}
.acct-head .name{font-size:17px; font-weight:800; color:var(--dark);}
.acct-head .tier{display:inline-block; margin-top:6px; font-size:11px; font-weight:700; padding:3px 12px; border-radius:10px; background:var(--lav2); color:var(--dark);}
.acct-stat{background:var(--lav2); border-radius:14px; padding:12px 16px; text-align:center; margin-bottom:16px;}
.acct-stat .num{font-size:20px; font-weight:800; color:var(--dark);}
.acct-stat .lbl{font-size:11px; color:var(--muted);}
.order-card{background:#f7f6fb; border-radius:14px; padding:12px 14px; margin-bottom:10px;}
.order-card .oh{display:flex; justify-content:space-between; font-size:13px; font-weight:700; color:var(--dark); margin-bottom:4px;}
.order-card .od{font-size:11px; color:var(--muted); margin-bottom:6px;}
.order-card .oi{font-size:12px; color:var(--ink); line-height:1.7;}

#commentsList{flex:1; overflow-y:auto; padding:14px 20px;}
.comment-row{padding:10px 0; border-bottom:1px solid #f0eff6;}
.comment-row .cn{font-size:12px; font-weight:700; color:var(--dark);}
.comment-row .ct{font-size:13px; color:var(--ink); margin-top:2px;}
.comment-row .cd{font-size:10px; color:var(--muted); margin-top:3px;}
.comment-input-row{display:flex; gap:8px; padding:14px 20px; border-top:1px solid #eee;}
.comment-input-row input{flex:1; padding:10px 14px; border:1px solid #eee; border-radius:20px; background:#f7f6fb; font-family:"Cairo"; font-size:13px;}
.comment-input-row button{background:var(--dark); color:#fff; border:none; border-radius:20px; padding:10px 18px; font-weight:700; font-size:13px; cursor:pointer; font-family:"Cairo";}

.reelsView{position:fixed; inset:0; z-index:40; background:#000; display:none;}
.reelsView.show{display:block;}
.reel-scroll{height:100%; overflow-y:scroll; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch;}
.reel-item{height:100%; scroll-snap-align:start; position:relative; display:flex; align-items:flex-end; overflow:hidden; background:#000;}
.reel-video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none;}
.reel-item .center-ic{position:absolute; top:42%; left:50%; transform:translate(-50%,-50%); width:110px; height:110px; opacity:.95;}
.reel-close{position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); left:16px; z-index:42; background:rgba(255,255,255,.15); border:none; color:#fff; width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer;}
.reel-actions{position:absolute; left:14px; bottom:110px; display:flex; flex-direction:column; gap:20px; align-items:center; z-index:1;}
.reel-actions .a{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:#fff;}
.reel-actions svg{width:25px; height:25px; fill:#fff;}
.reel-caption{position:relative; z-index:1; padding:16px 70px 40px 18px; color:#fff; width:100%;}
.reel-caption h4{margin:0 0 4px; font-size:15px;}
.reel-caption p{margin:0 0 10px; font-size:12px; opacity:.85;}
.reel-caption button{background:#fff; color:var(--dark); border:none; padding:7px 16px; border-radius:16px; font-size:12px; font-weight:700; cursor:pointer; font-family:"Cairo";}
.navrow .n.reel-tab{width:auto; height:auto; background:none; flex-direction:column; gap:4px; padding:0;}
.navrow .n.reel-tab .circle{width:40px; height:40px; border-radius:50%; background:linear-gradient(145deg,#F6B26B,#C9527E); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 14px -4px rgba(201,82,126,.6);}
.navrow .n.reel-tab .circle svg{width:18px; height:18px;}
.navrow .n.reel-tab span{color:#fff; font-size:10px; font-weight:700;}
.reel-store-btn{position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); left:16px; z-index:42; background:rgba(255,255,255,.9); border:none; color:var(--dark); padding:8px 16px; border-radius:20px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:"Cairo"; display:flex; align-items:center; gap:6px;}
</style>

function withTimeout(promise, ms=8000){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')), ms))
  ]);
}

// ===== قراءة مباشرة وسريعة عبر REST بدل SDK =====
// السبب: اختبار مباشر أثبت أن الاتصال بسيرفرات Firestore نفسه سريع (أقل من ثانية)،
// لكن قناة الاتصال الداخلية بمكتبة Firebase (WebChannel) تتعلّق لعشرات الثواني على بعض شبكات الجوال بالعراق.
// لذلك القراءة (get) نسويها بطلب HTTPS عادي (fetch) بدل db.collection(...).get() المتعلّق.
const FIRESTORE_REST_BASE = 'https://firestore.googleapis.com/v1/projects/dukan-jaafar/databases/(default)/documents';
function restFieldToJS(value){
  if(!value) return null;
  if('integerValue' in value) return parseInt(value.integerValue, 10);
  if('doubleValue' in value) return value.doubleValue;
  if('stringValue' in value) return value.stringValue;
  if('booleanValue' in value) return value.booleanValue;
  if('nullValue' in value) return null;
  if('timestampValue' in value) return new Date(value.timestampValue).getTime();
  if('arrayValue' in value) return ((value.arrayValue&&value.arrayValue.values)||[]).map(restFieldToJS);
  if('mapValue' in value) return restDocFieldsToJS((value.mapValue&&value.mapValue.fields)||{});
  return null;
}
function restDocFieldsToJS(fields){
  const obj = {};
  for(const key in (fields||{})){ obj[key] = restFieldToJS(fields[key]); }
  return obj;
}
function restDocId(name){ const parts=name.split('/'); return parts[parts.length-1]; }
async function restGetCollection(path, ms=8000){
  const res = await withTimeout(fetch(`${FIRESTORE_REST_BASE}/${path}`), ms);
  if(!res.ok){ if(res.status===404) return []; throw new Error('REST '+res.status); }
  const data = await res.json();
  const docs = data.documents || [];
  return docs.map(d=>({ id: restDocId(d.name), data: ()=>restDocFieldsToJS(d.fields) }));
}
async function restGetDoc(path, ms=6000){
  const res = await withTimeout(fetch(`${FIRESTORE_REST_BASE}/${path}`), ms);
  if(res.status===404) return {exists:false, data:()=>null};
  if(!res.ok) throw new Error('REST '+res.status);
  const data = await res.json();
  return {exists:true, data:()=>restDocFieldsToJS(data.fields)};
}

    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    // إعداد اتصال أكثر ثباتًا لبعض شبكات الجوال اللي تحجب الاتصال المباشر (WebChannel) وتسبب تعليق لا نهائي
    try{ db.settings({experimentalAutoDetectLongPolling:true, merge:true}); }catch(e){}
  }catch(e){ db=null; console.error('تعذر الاتصال بـ Firebase:', e); }

  uid = localStorage.getItem("guestId");
  if(!uid){ uid = "g_"+Math.random().toString(36).slice(2); localStorage.setItem("guestId", uid); }

  if(db && uid) profileRef = db.doc(`data/users/${uid}/profile`);

  // نتأكد من بيانات الزبون المحفوظة محليًا بالجهاز أولًا (أسرع وأضمن، ما تتأثر بمشاكل الشبكة)
  const localProfile = JSON.parse(localStorage.getItem('profile')||'null');
  if(localProfile && localProfile.name){
    applyProfile(localProfile);
    // نحاول نزامن مع Firestore بالخلفية بدون ما نوقف عرض التطبيق
    if(db && profileRef){
      restGetDoc(`data/users/${uid}/profile`, 6000).then(snap=>{
        if(snap.exists && snap.data().name){
          const remote = snap.data();
          // نأخذ أعلى قيمة مصاريف بين النسخة المحلية والبعيدة تجنبًا لأي فقدان بيانات
          const merged = {...remote, totalSpent: Math.max(remote.totalSpent||0, localProfile.totalSpent||0)};
          localStorage.setItem('profile', JSON.stringify(merged));
          applyProfile(merged);
        } else {
          profileRef.set(localProfile).catch(()=>{});
          db.collection('customers').doc(uid).set({...localProfile, uid}).catch(()=>{});
        }
      }).catch(()=>{});
    }
  } else if(db && profileRef){
    try{
      const snap = await restGetDoc(`data/users/${uid}/profile`, 6000);
      if(snap.exists && snap.data().name){
        applyProfile(snap.data());
        localStorage.setItem('profile', JSON.stringify(snap.data()));
      } else document.getElementById('nameOverlay').classList.add('show');
    }catch(e){ document.getElementById('nameOverlay').classList.add('show'); }
  } else {
    document.getElementById('nameOverlay').classList.add('show');
  }
  loadViews();
}
function applyProfile(p){
  const tier = (p.totalSpent||0) >= VIP_THRESHOLD ? "VIP" : "زبون";
  document.getElementById('userChip').textContent = `${p.name} · ${tier}`;
}

  localStorage.setItem('profile', JSON.stringify(profile));

});
async function loadViews(){
  const baseStats = id => ({likes:0, comments:0}); // أرقام حقيقية فقط، بدون تضخيم وهمي
  if(!db){
    products.forEach(p=>{ stockCounts[p.id]=p.stock; reelStats[p.id]=baseStats(p.id); });
    renderGrid(); renderReels(); return;
  }
  try{
    const RESET_FLAG = 'fakeStatsResetV2';
    if(!localStorage.getItem(RESET_FLAG)){
      try{
        const batch = db.batch();
        products.forEach(p=>{ batch.set(db.collection('products').doc(String(p.id)), {likes:0, comments:0}, {merge:true}); });
        await withTimeout(batch.commit(), 6000);
      }catch(e){}
      localStorage.setItem(RESET_FLAG, '1');
    }
    let snap;
    for(let attempt=1; attempt<=3; attempt++){
      try{ snap = { docs: await restGetCollection('products', 9000) }; break; }
      catch(e){ if(attempt===3) throw e; await new Promise(r=>setTimeout(r,800)); }
    }
    const localIds = new Set(products.map(p=>p.id));
    // منتجات أضافها صاحب المتجر من لوحة التحكم (غير موجودة محليًا) تنضاف هنا تلقائيًا
    snap.docs.forEach(d=>{
      const data = d.data();
      if(!localIds.has(d.id) && data.name && data.cat && typeof data.price==='number'){
        products.push({id:d.id, name:data.name, cat:data.cat, price:data.price, stock:typeof data.stock==='number'?data.stock:0});
        localIds.add(d.id);
      }
    });
    snap.docs.forEach(d=>{
      const data = d.data();
      viewCounts[d.id]=data.views||0;
      if(typeof data.stock==='number') stockCounts[d.id]=data.stock;
      if(data.image) productImages[d.id]=data.image;
      if(data.videoUrl) productVideos[d.id]=data.videoUrl;
      if(typeof data.likes==='number' || typeof data.comments==='number'){
        reelStats[d.id] = {likes: data.likes!=null?data.likes:baseStats(d.id).likes, comments: data.comments!=null?data.comments:baseStats(d.id).comments};
      }
    });
    for(const p of products){
      if(!(p.id in stockCounts)){
        stockCounts[p.id] = p.stock;
        try{ await db.collection('products').doc(p.id).set({stock:p.stock}, {merge:true}); }catch(e){}
      }
      if(!(p.id in reelStats)){
        reelStats[p.id] = baseStats(p.id);
        try{ await db.collection('products').doc(p.id).set(baseStats(p.id), {merge:true}); }catch(e){}
      }
    }
  }catch(e){
    products.forEach(p=>{ if(!(p.id in stockCounts)) stockCounts[p.id]=p.stock; if(!(p.id in reelStats)) reelStats[p.id]=baseStats(p.id); });
  }
  renderFilters(); renderGrid(); renderReels();
}
async function registerView(id){
  if(!db){ viewCounts[id]=(viewCounts[id]||0)+1; return; }
  try{
    const ref = db.collection('products').doc(id);
    const snap = await ref.get();
    const current = snap.exists ? (snap.data().views||0) : 0;
    await ref.set({views: current+1});
    viewCounts[id] = current+1;
  }catch(e){}
}

function topViewedId(){

function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function cartTotal(){ return Object.entries(cart).reduce((s,[id,q])=>s+products.find(p=>p.id===id).price*q,0); }
function renderCart(){

function canAddOne(id){
  const stock = stockCounts[id]!==undefined ? stockCounts[id] : Infinity;
  if((cart[id]||0) >= stock){ alert('نفذت الكمية المتوفرة من هذا المنتج'); return false; }

}

function renderReels(){
  const scrollEl = document.getElementById('reelScroll');

  scrollEl.innerHTML = products.map(p=>`
    <div class="reel-item ${p.cat}" data-vid-id="${p.id}" style="background:linear-gradient(160deg,var(--${p.cat==='شرقي'?'amber1':p.cat==='نسائي'?'rose1':'teal1'}),var(--${p.cat==='شرقي'?'amber2':p.cat==='نسائي'?'rose2':'teal2'}))">

        <div class="a" data-share="${p.id}"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2-6z"/></svg><span>مشاركة</span></div>
      </div>
      <div class="reel-caption">
        <h4>${p.name}</h4>
        <p>${reelCaptions[p.id]||''}</p>
        <button data-reel-add="${p.id}">أضف للسلة · $${p.price}</button>
      </div>
    </div>
  `).join('');
  scrollEl.scrollTop = prevScroll;
  scrollEl.querySelectorAll('.reel-item[data-vid-id]').forEach(item=>{
    const id = item.dataset.vidId;
    const video = item.querySelector('video[data-video]');
    const fallback = item.querySelector('[data-fallback]');
    // فيديو مرفوع من لوحة التحكم له الأولوية، وإلا نجرب اسم الملف بالمشروع كخيار قديم
    const uploaded = productVideos[id];
    const candidates = uploaded ? [uploaded] : [`${id}.mp4`, `${id}.MP4`];
    let i = 0;
    function tryNext(){
      if(i >= candidates.length) return;
      video.src = candidates[i++];
    }
    video.addEventListener('error', tryNext);
    video.addEventListener('loadeddata', ()=>{
      video.style.display = 'block';
      fallback.style.display = 'none';
      item.style.background = '#000';
      video.play().catch(()=>{});
    });
    tryNext();
  });
}

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }
function commentsCacheKey(id){ return 'commentsCache_'+id; }
function renderCommentsHTML(comments){
  if(comments.length===0) return '<div class="empty">ماكو تعليقات بعد، كن أول من يعلّق</div>';
  return comments.map(c=>{

  }).join('');

async function renderComments(id, attempt=1){
  const list = document.getElementById('commentsList');
  let hadCache = false;
  if(attempt===1){
    // اعرض آخر نسخة محفوظة محليًا فورًا (إذا موجودة) بدل ما الزبون يضل يحدق بـ"جاري التحميل"
    try{
      const cached = JSON.parse(localStorage.getItem(commentsCacheKey(id))||'null');
      if(cached && Array.isArray(cached)){
        list.innerHTML = renderCommentsHTML(cached);
        list.scrollTop = list.scrollHeight;
        hadCache = true;
      } else {
        list.innerHTML = '<div class="loading">جاري التحميل...</div>';
      }
    }catch(e){ list.innerHTML = '<div class="loading">جاري التحميل...</div>'; }
  }
  if(!db){ if(!hadCache) list.innerHTML = '<div class="empty">التعليقات تحتاج اتصال بالإنترنت</div>'; return; }
  try{
    const snap = { docs: await restGetCollection(`products/${id}/comments`, 6000) };
    // إذا المستخدم غيّر المنتج أو سكر اللوحة أثناء التحميل، لا تحدّث القائمة القديمة
    if(activeCommentProductId !== id) return;
    const comments = snap.docs.map(d=>d.data()).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    list.innerHTML = renderCommentsHTML(comments);
    list.scrollTop = list.scrollHeight;
    try{ localStorage.setItem(commentsCacheKey(id), JSON.stringify(comments)); }catch(e){}
  }catch(e){
    if(activeCommentProductId !== id) return;
    if(attempt < 2){
      // إعادة محاولة تلقائية وحدة بس قبل ما نعرض خطأ (الشبكة أحيانًا تكون بطيئة لحظيًا)
      await sleep(600);
      if(activeCommentProductId === id) return renderComments(id, attempt+1);
      return;
    }
    // إذا عندنا نسخة محفوظة محليًا، خلها ظاهرة وما نعرض خطأ يمسحها
    if(hadCache) return;
    list.innerHTML = '<div class="empty">تعذر تحميل التعليقات، تأكد من الإنترنت<br><button class="retryBtn" id="retryCommentsBtn">إعادة المحاولة</button></div>';
    const retryBtn = document.getElementById('retryCommentsBtn');
    if(retryBtn) retryBtn.addEventListener('click', ()=>renderComments(id, 1));
  }
}
async function submitComment(){
  const id = activeCommentProductId; if(!id) return;
  const input = document.getElementById('commentInput');
  const text = input.value.trim();
  if(!text) return;
  const name = (JSON.parse(localStorage.getItem('profile')||'{}').name) || 'زائر';
  input.value = '';
  if(!reelStats[id]) reelStats[id] = {likes:0, comments:0};
  reelStats[id].comments += 1;
  if(db){
    try{
      await db.collection('products').doc(id).collection('comments').add({text, createdAt:Date.now(), name});
      await db.collection('products').doc(id).set({comments:reelStats[id].comments}, {merge:true});
    }catch(e){}
  }
  renderComments(id);
  renderReels();
}
document.getElementById('commentSendBtn').addEventListener('click', submitComment);
document.getElementById('commentInput').addEventListener('keydown', e=>{ if(e.key==='Enter') submitComment(); });

// ===== مشاركة موثوقة (تشتغل حتى لو الجهاز ما يدعم مشاركة النظام) =====
function shareContent(shareData){
  // navigator.share() أحيانًا يرمي خطأ فوري (مو Promise مرفوض) إذا انسحب "user activation"
  // بسبب أن الضغطة صارت من حدث click متأخر (بعد سكرول/سنابنق الريلز)، فنغلّفها بـ try/catch
  // حتى ما تنكسر العملية بصمت وتوصل دايمًا لبديل واتساب
  try{
    if(navigator.share){
      const p = navigator.share(shareData);
      if(p && typeof p.catch==='function'){
        p.catch(err=>{
          // إذا المستخدم نفسه سكّر قائمة المشاركة (إلغاء)، ما نسوي شي — هذا طبيعي وليس خطأ
          if(err && err.name==='AbortError') return;
          shareViaWhatsApp(shareData);
        });
      }
    } else {
      shareViaWhatsApp(shareData);
    }
  }catch(e){
    shareViaWhatsApp(shareData);
  }
}
function shareViaWhatsApp(shareData){
  const text = encodeURIComponent(`${shareData.text}\n${shareData.url}`);
  // window.open('_blank') يترد (يتحجب) بسفاري بالجوال لأنه صار بمكالمة غير مباشرة (داخل Promise)
  // لذلك نستخدم تنقّل مباشر بنفس التبويب، وهذا ما يترد أبدًا
  location.href = `https://wa.me/?text=${text}`;
}
document.getElementById('checkoutBtn').addEventListener('click', async ()=>{
  const items = Object.entries(cart);
  if(items.length===0){ alert('السلة فارغة!'); return; }
  let msg = "مرحبا، بدي أطلب:\n";
  items.forEach(([id,q])=>{ const p=products.find(pr=>pr.id===id); msg += `- ${p.name} × ${q} = $${p.price*q}\n`; });
  const total = cartTotal();
  msg += `\nالإجمالي: $${total}`;
  try{
    if(db && profileRef){
      const snapBefore = await profileRef.get();
      const customerName = (snapBefore.exists && snapBefore.data().name) || 'زبون';
      await profileRef.collection('orders').add({items:cart, total, createdAt:Date.now(), uid, name:customerName});
      const snap = await profileRef.get();
      const newTotal = (snap.data().totalSpent||0) + total;
      const updated = {...snap.data(), totalSpent:newTotal};
      await profileRef.set(updated);
      applyProfile(updated);
      localStorage.setItem('profile', JSON.stringify(updated));
      try{ await db.collection('customers').doc(uid).set({...updated, uid}); }catch(e){}
    } else {
      const p = JSON.parse(localStorage.getItem('profile')||'{}');
      p.totalSpent = (p.totalSpent||0) + total;
      localStorage.setItem('profile', JSON.stringify(p));
      applyProfile(p);
    }
    for(const [id,q] of items){
      const newStock = Math.max(0, (stockCounts[id]!==undefined?stockCounts[id]:products.find(pr=>pr.id===id).stock) - q);
      stockCounts[id] = newStock;
      if(db){ try{ await db.collection('products').doc(id).set({stock:newStock}, {merge:true}); }catch(e){} }
    }
    renderGrid();
  }catch(e){}
  pendingOrderMsg = msg;
  document.getElementById('waOverlay').classList.add('show');
});
document.getElementById('socialWaBtn').addEventListener('click', (e)=>{
  e.preventDefault();
  pendingOrderMsg = "مرحبا، عندي استفسار بخصوص دُكَّان جهفر";
  document.getElementById('waOverlay').classList.add('show');
});
document.querySelectorAll('.wa-choice').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const num = btn.dataset.num;
    document.getElementById('waOverlay').classList.remove('show');
    window.open(`https://wa.me/${num}?text=${encodeURIComponent(pendingOrderMsg)}`, '_blank');
  });
});
document.getElementById('waOverlay').addEventListener('click', (e)=>{
  if(e.target.id==='waOverlay') document.getElementById('waOverlay').classList.remove('show');
});
</script>
