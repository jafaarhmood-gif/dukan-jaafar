:root{
  --dark:#211F45; --lav1:#CFCBEC; --lav2:#E7E4F7; --muted:#7A76A0; --danger:#c94747; --ok:#2E8C82;
  box-sizing:border-box;
}
*{box-sizing:border-box;}
body{margin:0; font-family:"Cairo",sans-serif; background:var(--lav2); color:var(--dark); padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
header{background:var(--dark); color:#fff; padding:16px 18px; position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between;}
header h1{font-size:16px; margin:0;}
.tabs-wrap{position:relative;}
.tabs-wrap::after{content:"‹ مرر"; position:absolute; top:12px; left:6px; font-size:10px; color:#fff; background:rgba(33,31,69,.6); padding:4px 8px; border-radius:10px; pointer-events:none; z-index:1; transition:opacity .3s;}
.tabs-wrap.scrolled::after{opacity:0;}
.tabs{display:flex; gap:8px; padding:12px 14px 0; overflow-x:auto; -webkit-overflow-scrolling:touch;}
.tabs button{flex:none; background:#fff; border:none; padding:8px 16px; border-radius:16px; font-family:"Cairo"; font-size:13px; font-weight:700; color:var(--dark); cursor:pointer;}
.tabs button.active{background:var(--dark); color:#fff;}
main{padding:14px;}
.card{background:#fff; border-radius:16px; padding:14px; margin-bottom:10px; box-shadow:0 6px 16px -10px rgba(33,31,69,.25);}
.card h3{margin:0 0 4px; font-size:14px;}
.card .sub{font-size:12px; color:var(--muted); margin-bottom:8px;}
.row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:6px;}
.stock-controls{display:flex; align-items:center; gap:8px;}
.stock-controls button{width:30px; height:30px; border-radius:8px; border:none; background:var(--lav2); font-size:16px; cursor:pointer;}
.stock-controls input{width:54px; text-align:center; border:1px solid var(--lav1); border-radius:8px; padding:5px; font-family:"Cairo"; font-size:13px;}
.stock-controls .save{background:var(--ok); color:#fff; font-size:12px; padding:6px 12px; border-radius:10px;}
.badge{font-size:11px; padding:3px 9px; border-radius:10px; font-weight:700;}
.badge.out{background:#fde3e3; color:var(--danger);}
.badge.ok{background:#e2f3f1; color:var(--ok);}
.badge.vip{background:#fff3d6; color:#a8790a;}
.order-items{font-size:12px; color:var(--muted); margin-top:4px;}
#pinScreen{position:fixed; inset:0; background:var(--dark); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; z-index:50; padding:20px;}
#pinScreen input{padding:12px 16px; border-radius:12px; border:none; font-size:18px; text-align:center; letter-spacing:4px; width:160px; font-family:"Cairo";}
#pinScreen button{padding:11px 26px; border-radius:12px; border:none; background:#fff; color:var(--dark); font-weight:700; font-family:"Cairo"; cursor:pointer;}
#pinScreen p{color:#fff; font-size:13px; opacity:.8;}
#pinError{color:#ff9d9d; font-size:12px; min-height:16px;}
.empty{text-align:center; color:var(--muted); font-size:13px; padding:30px 0;}
.loading{text-align:center; color:var(--muted); font-size:13px; padding:20px 0;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:700;}
.field input, .field select{width:100%; padding:11px 12px; border:1px solid var(--lav1); border-radius:10px; font-family:"Cairo"; font-size:14px; background:#fff; color:var(--dark);}
.addBtn{width:100%; background:var(--dark); color:#fff; border:none; padding:13px; border-radius:12px; font-family:"Cairo"; font-weight:700; font-size:14px; cursor:pointer; margin-top:6px;}
.hint{background:var(--lav2); border-radius:12px; padding:12px 14px; font-size:12px; color:var(--dark); line-height:1.8; margin-bottom:14px;}
.hint b{color:#a8790a;}
#addMsg{font-size:13px; text-align:center; margin-top:10px; min-height:18px;}
#addMsg.ok{color:var(--ok);}
#addMsg.err{color:var(--danger);}
.media-row{display:flex; gap:8px; margin-top:8px;}
.media-btn{flex:1; background:var(--lav2); border:1px dashed var(--lav1); border-radius:10px; padding:10px 6px; font-family:"Cairo"; font-size:12px; font-weight:700; color:var(--dark); text-align:center; cursor:pointer; position:relative; overflow:hidden;}
.media-btn.has{background:#e2f3f1; border-color:var(--ok); color:var(--ok);}
.media-btn input{position:absolute; inset:0; opacity:0; cursor:pointer;}
.thumb{width:44px; height:44px; border-radius:10px; object-fit:cover; margin-left:10px; flex:none; background:var(--lav2);}
.prod-head{display:flex; align-items:center; gap:0;}
.prod-info{flex:1;}
.up-status{font-size:11px; color:var(--muted); margin-top:6px; min-height:14px;}
#reportPrintArea .row{display:flex; justify-content:space-between; padding:6px 0; font-size:13px; border-bottom:1px solid #f0eff6;}
@media print{
  header, .tabs, #printReportBtn, #lastUpdate{display:none !important;}
  body{background:#fff;}
  #reportPrintArea{box-shadow:none; border:none;}
}

<script>
const firebaseConfig = {

const ADMIN_PIN = "1234"; // غيّر هذا الرقم لرمز تختاره انت

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
try{ db.settings({experimentalAutoDetectLongPolling:true, merge:true}); }catch(e){}

function withTimeout(promise, ms=8000){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')), ms))
  ]);
}

// ===== قراءة مباشرة وسريعة عبر REST بدل SDK (نفس السبب الموجود بالتطبيق الرئيسي) =====
const FIRESTORE_REST_BASE = 'https://firestore.googleapis.com/v1/projects/dukan-jaafar/databases/(default)/documents';
function restFieldToJS(value){
  if(!value) return null;
  if('integerValue' in value) return parseInt(value.integerValue, 10);
  if('doubleValue' in value) return value.doubleValue;
  if('stringValue' in value) return value.stringValue;
  if('booleanValue' in value) return value.booleanValue;
  if('nullValue' in value) return null;
  if('timestampValue' in value) return new Date(value.timestampValue).getTime();
  if('arrayValue' in value) return ((value.arrayValue&&value.arrayValue.values)||[]).map(restFieldToJS);
  if('mapValue' in value) return restDocFieldsToJS((value.mapValue&&value.mapValue.fields)||{});
  return null;
}
function restDocFieldsToJS(fields){
  const obj = {};
  for(const key in (fields||{})){ obj[key] = restFieldToJS(fields[key]); }
  return obj;
}
function restDocId(name){ const parts=name.split('/'); return parts[parts.length-1]; }
async function restGetDoc(path, ms=6000){
  const res = await withTimeout(fetch(`${FIRESTORE_REST_BASE}/${path}`), ms);
  if(res.status===404) return {exists:false, data:()=>null};
  if(!res.ok) throw new Error('REST '+res.status);
  const data = await res.json();
  return {exists:true, data:()=>restDocFieldsToJS(data.fields)};
}
async function restGetCollection(path, ms=8000){
  const res = await withTimeout(fetch(`${FIRESTORE_REST_BASE}/${path}`), ms);
  if(!res.ok){ if(res.status===404) return []; throw new Error('REST '+res.status); }
  const data = await res.json();
  const docs = data.documents || [];
  return docs.map(d=>({ id: restDocId(d.name), data: ()=>restDocFieldsToJS(d.fields) }));
}
// استعلام عبر كل المجموعات الفرعية المسماة نفس الاسم (زي orders تحت كل زبون) — يقابل collectionGroup بالـ SDK
async function restCollectionGroup(collectionId, ms=8000){
  const res = await withTimeout(fetch(`${FIRESTORE_REST_BASE}:runQuery`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ structuredQuery: { from: [{collectionId, allDescendants:true}] } })
  }), ms);
  if(!res.ok) throw new Error('REST '+res.status);
  const rows = await res.json();
  return rows.filter(r=>r.document).map(r=>({
    id: restDocId(r.document.name),
    ref: { path: r.document.name.split('/documents/')[1] },
    data: ()=>restDocFieldsToJS(r.document.fields)
  }));
}
// يضغط الصورة ويحوّلها لنص Base64 ويخزّنها مباشرة بقاعدة البيانات — مجاني بدون أي خدمة رفع ملفات
function imageToBase64(file, maxDim=560, quality=0.72){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read-failed'));
    reader.onload = ()=>{
      img.onerror = ()=>reject(new Error('image-failed'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function loadAll(){

  try{
    await loadCategoryTree();
    let prodDocs;
    const MAX_ATTEMPTS = 5;

      try{
        prodDocs = await restGetCollection('products', 15000);

        if(prodDocs.length > 0 || attempt===MAX_ATTEMPTS) break;
        await new Promise(r=>setTimeout(r,1000));
      }
      catch(e){ if(attempt===MAX_ATTEMPTS) throw e; await new Promise(r=>setTimeout(r,1000)); }
    }
    productsLoadFailed = false;
    products = [];
    prodDocs.forEach(d=>{
      const data = d.data();
      stockData[d.id] = data;
      if(data.name && typeof data.price==='number'){
        products.push({
          id: d.id, name: data.name,
          category: data.category || data.cat || "عطور",
          subcategory: data.subcategory || "",
          price: data.price,
          costPrice: typeof data.costPrice==='number' ? data.costPrice : 0,
          description: data.description || "",
          sizes: Array.isArray(data.sizes) ? data.sizes : null,

    });

    const ordersDocs = await restCollectionGroup('orders');
    // نحتفظ بكل الطلبات (بدون قطع) عشان التقارير تكون دقيقة، ونكتفي بعرض آخر 100 بس بتبويب "الطلبات"
    ordersData = ordersDocs.map(d=>({...d.data(), _path:d.ref.path}))
      .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

    const profileDocs = await restGetCollection('customers');
    customersData = profileDocs.map(d=>d.data()).filter(p=>p && p.name);

    try{
      const partnerDocs = await restGetCollection('partners');
      partnersData = partnerDocs.map(d=>({id:d.id, ...d.data()}));
    }catch(e){ partnersData = []; }

    const reelDocs = await restGetCollection('reels');
    reelsData = reelDocs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));

    try{ const bnDocs = await restGetCollection('banners'); bannersData = bnDocs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0)); }catch(e){ bannersData = []; }

    const galDocs = await restGetCollection('customerPhotos');
    galPhotosData = galDocs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

    const supplyDocs = await restGetCollection('supplierPurchases');
    supplyData = supplyDocs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(b.date||b.createdAt||0)-(a.date||a.createdAt||0));

    const catalogDocs = await restGetCollection('supplierCatalogs');
    catalogsData = catalogDocs.map(d=>({id:d.id, name:d.id, items:[], ...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||'', 'ar'));

    document.getElementById('lastUpdate').textContent = 'آخر تحديث: ' + new Date().toLocaleTimeString('ar');
  }catch(e){
    productsLoadFailed = true;
    document.getElementById('main').innerHTML = '<div class="empty">صار خطأ بتحميل البيانات، تأكد من الاتصال بالإنترنت وحاول من جديد.<br><button id="retryLoadAllBtn" style="margin-top:12px; background:#211F45; color:#fff; border:none; border-radius:10px; padding:8px 20px; cursor:pointer;">إعادة المحاولة</button></div>';
    const retryBtn = document.getElementById('retryLoadAllBtn');
    if(retryBtn) retryBtn.addEventListener('click', loadAll);
    console.error(e);
    return;
  }
  render();
}

// ===== أدوات مشتركة لإدخال الأحجام المتعددة (عطور زيتية وغيرها) =====
function sizeRowHtml(label, price, cost){
  return `<div class="size-row" style="display:flex; gap:6px; margin-bottom:6px; align-items:center;">
    <input type="text" placeholder="الحجم (مثال: 30 مل)" class="sz-label" value="${label||''}" style="flex:1.3; padding:8px; border-radius:8px; border:1px solid #ddd;">
    <input type="number" placeholder="السعر (د.ع)" class="sz-price" value="${price!=null?price:''}" style="flex:1; padding:8px; border-radius:8px; border:1px solid #ddd;">
    <input type="number" placeholder="التكلفة (د.ع)" class="sz-cost" value="${cost!=null?cost:''}" style="flex:1; padding:8px; border-radius:8px; border:1px solid #ddd;">
    <button type="button" class="sz-del" style="background:none; border:none; color:#c0392b; cursor:pointer; font-size:18px;">✕</button>
  </div>`;
}
function collectSizeRows(listId){
  const rows = document.querySelectorAll('#'+listId+' .size-row');
  const out = [];
  rows.forEach(row=>{
    const label = row.querySelector('.sz-label').value.trim();
    const price = Number(row.querySelector('.sz-price').value);
    const costPrice = Math.max(0, Number(row.querySelector('.sz-cost').value)||0);
    if(label && price>0) out.push({label, price, costPrice});
  });
  return out;
}
// يربط تشيك بوكس "أحجام متعددة" بإظهار/إخفاء الحقول المناسبة، وزر إضافة صف جديد، وحذف الصفوف
function setupSizesUI(checkboxId, simpleWrapId, sizesWrapId, listId, addBtnId, initialSizes){
  const checkbox = document.getElementById(checkboxId);
  const simpleWrap = document.getElementById(simpleWrapId);
  const sizesWrap = document.getElementById(sizesWrapId);
  const list = document.getElementById(listId);
  const addBtn = document.getElementById(addBtnId);
  function refreshVisibility(){
    const on = checkbox.checked;
    simpleWrap.style.display = on ? 'none' : '';
    sizesWrap.style.display = on ? '' : 'none';
    if(on && list.children.length===0) list.insertAdjacentHTML('beforeend', sizeRowHtml());
  }
  if(initialSizes && initialSizes.length){
    checkbox.checked = true;
    list.innerHTML = initialSizes.map(s=>sizeRowHtml(s.label, s.price, s.costPrice)).join('');
  }
  refreshVisibility();
  checkbox.addEventListener('change', refreshVisibility);
  addBtn.addEventListener('click', ()=> list.insertAdjacentHTML('beforeend', sizeRowHtml()));
  list.addEventListener('click', e=>{
    const del = e.target.closest('.sz-del'); if(!del) return;
    del.closest('.size-row').remove();
    if(list.children.length===0) list.insertAdjacentHTML('beforeend', sizeRowHtml());
  });
}

// عملة التطبيق: دينار عراقي (د.ع)
function fmtIQD(n){ return Math.round(n||0).toLocaleString('en-US') + ' د.ع'; }
function monthKey(ts){
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function monthLabel(key){
  const [y,m] = key.split('-');
  const names = ["","يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  return `${names[Number(m)]} ${y}`;
}
function renderReports(){
  const main = document.getElementById('main');
  let totalRevenue = 0, totalCost = 0, ordersCount = ordersData.length;
  const byMonth = {};
  ordersData.forEach(o=>{
    const rev = o.total||0;
    const cost = (o.costTotal!=null ? o.costTotal : 0) + (o.partnerCommission||0);
    totalRevenue += rev; totalCost += cost;
    const key = o.createdAt ? monthKey(o.createdAt) : 'غير معروف';
    if(!byMonth[key]) byMonth[key] = {revenue:0, cost:0, count:0};
    byMonth[key].revenue += rev; byMonth[key].cost += cost; byMonth[key].count += 1;
  });
  const totalProfit = totalRevenue - totalCost;
  const monthKeys = Object.keys(byMonth).sort().reverse();

  const stockValue = products.reduce((s,p)=>{
    const stock = stockData[p.id] ? (stockData[p.id].stock||0) : 0;
    return s + stock * (p.costPrice||0);
  }, 0);
  const outCount = products.filter(p=>{
    const stock = stockData[p.id] ? (stockData[p.id].stock||0) : 0;
    return stock<=0;
  }).length;
  const lowCount = products.filter(p=>{
    const stock = stockData[p.id] ? (stockData[p.id].stock||0) : 0;
    return stock>0 && stock<=3;
  }).length;

  main.innerHTML = `
    <div class="hint">تقرير شامل بالأرباح والمبيعات والمخزون. اضغط "طباعة" لحفظه كـPDF أو طباعته مباشرة.</div>
    <button class="addBtn" id="printReportBtn" style="margin-bottom:14px;">🖨️ طباعة التقرير</button>
    <div class="card" id="reportPrintArea">
      <h2 style="margin-top:0;">تقرير دُكَّان جهفر — ${new Date().toLocaleDateString('ar')}</h2>
      <div class="row"><span>إجمالي المبيعات</span><b>${fmtIQD(totalRevenue)}</b></div>
      <div class="row"><span>إجمالي التكلفة</span><b>${fmtIQD(totalCost)}</b></div>
      <div class="row"><span>صافي الربح</span><b>${fmtIQD(totalProfit)}</b></div>
      <div class="row"><span>عدد الطلبات</span><b>${ordersCount}</b></div>
      <hr>
      <h3>المخزون</h3>
      <div class="row"><span>قيمة المخزون الحالي (بسعر التكلفة)</span><b>${fmtIQD(stockValue)}</b></div>
      <div class="row"><span>منتجات نفذت كميتها</span><b>${outCount}</b></div>
      <div class="row"><span>منتجات كميتها قليلة (٣ أو أقل)</span><b>${lowCount}</b></div>
      <hr>
      <h3>تفصيل شهري</h3>
      ${monthKeys.length===0 ? '<div class="empty">ماكو طلبات بعد</div>' : monthKeys.map(k=>{
        const m = byMonth[k];
        const profit = m.revenue - m.cost;
        return `<div class="row"><span>${k==='غير معروف'?'غير معروف':monthLabel(k)} (${m.count} طلب)</span><b>ربح ${fmtIQD(profit)}</b></div>`;
      }).join('')}
    </div>`;
  document.getElementById('printReportBtn').addEventListener('click', ()=>window.print());
}

function renderReels(){

      لحد ما تنشر أول ريلز هنا، التطبيق يولّد ريلز تلقائي من المنتجات (نفس الشكل القديم) عشان الشاشة ما تطلع فاضية.
    </div>
    <div id="reelsList"></div>
    <div class="card">
      <b>ريلز جديد</b>
      <div class="field"><label>النص المرافق للريلز</label><textarea id="newReelCaption" rows="2" style="width:100%; font-family:inherit; font-size:13px; padding:6px; border-radius:8px;"></textarea></div>
      <div class="field"><label>ربط بمنتج (اختياري)</label>
        <select id="newReelProduct">
          <option value="">بدون منتج مرتبط</option>
          ${products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}

      <div class="field"><label>رابط فيديو مباشر (اختياري)</label><input id="newReelVideo" placeholder="https://..."></div>

        <div class="field"><label>ربط بمنتج</label>
          <select data-prod="${r.id}">
            <option value="">بدون منتج مرتبط</option>
            ${products.map(pp=>`<option value="${pp.id}" ${pp.id===r.productId?'selected':''}>${pp.name}</option>`).join('')}
          </select>

        <div class="field"><label>رابط فيديو مباشر</label><input data-vid="${r.id}" value="${r.videoUrl||''}" placeholder="اتركه فاضي لاستخدام reel-${r.id}.mp4"></div>
        <div class="field"><label>الترتيب</label><input type="number" data-ord="${r.id}" value="${typeof r.order==='number'?r.order:0}"></div>

          <button class="save" data-save-reel="${r.id}">حفظ</button>
          <button data-toggle-reel="${r.id}" style="background:#eee; color:#333; border:none; padding:8px 14px; border-radius:8px; cursor:pointer;">${r.active===false?'نشر':'إخفاء'}</button>

        </div>
      </div>`).join('') || '<div class="empty">ماكو ريلزات منشورة بعد</div>';

    document.getElementById('reelsList').querySelectorAll('[data-save-reel]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const id = b.dataset.saveReel;
        const caption = document.querySelector(`[data-cap="${id}"]`).value.trim();
        const productId = document.querySelector(`[data-prod="${id}"]`).value;
        const videoUrl = document.querySelector(`[data-vid="${id}"]`).value.trim();
        const order = Number(document.querySelector(`[data-ord="${id}"]`).value)||0;
        await db.collection('reels').doc(id).set({caption, productId, videoUrl, order}, {merge:true});
        const r = reelsData.find(x=>x.id===id);
        Object.assign(r, {caption, productId, videoUrl, order});
        b.textContent = 'تم الحفظ ✓';
        setTimeout(()=>{ b.textContent='حفظ'; }, 1200);
      });
    });
    document.getElementById('reelsList').querySelectorAll('[data-toggle-reel]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const id = b.dataset.toggleReel;
        const r = reelsData.find(x=>x.id===id);
        const newActive = r.active===false ? true : false;
        await db.collection('reels').doc(id).set({active:newActive}, {merge:true});
        r.active = newActive;
        renderList();
      });
    });
    document.getElementById('reelsList').querySelectorAll('[data-del-reel]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if(!confirm('حذف هذا الريلز نهائيًا؟')) return;
        const id = b.dataset.delReel;
        await db.collection('reels').doc(id).delete();
        reelsData = reelsData.filter(x=>x.id!==id);
        renderList();
      });
    });
    document.getElementById('reelsList').querySelectorAll('[data-copy-filename]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const name = b.dataset.copyFilename;
        try{
          await navigator.clipboard.writeText(name);
          b.textContent = 'انتسخ ✓';
        }catch(e){
          const inp = b.previousElementSibling; if(inp){ inp.select(); document.execCommand('copy'); }
          b.textContent = 'انتسخ ✓';
        }
        setTimeout(()=>{ b.textContent='نسخ'; }, 1200);
      });
    });
  }
  renderList();
  document.getElementById('newReelSubmit').addEventListener('click', async ()=>{
    const caption = document.getElementById('newReelCaption').value.trim();
    const productId = document.getElementById('newReelProduct').value;
    const videoUrl = document.getElementById('newReelVideo').value.trim();
    const order = Number(document.getElementById('newReelOrder').value)||0;
    const msg = document.getElementById('reelMsg');
    if(!caption && !productId){ msg.className='err'; msg.textContent='لازم تكتب نص أو تربط بمنتج على الأقل'; return; }
    msg.textContent = 'جاري النشر...';
    try{
      const ref = await db.collection('reels').add({caption, productId, videoUrl, order, active:true, likes:0, comments:0, shares:0, createdAt:Date.now()});
      reelsData.push({id:ref.id, caption, productId, videoUrl, order, active:true, likes:0, comments:0, shares:0});
      reelsData.sort((a,b)=>(a.order||0)-(b.order||0));
      msg.className='ok';
      const fname = `reel-${ref.id}.mp4`;
      msg.innerHTML = `تم النشر ✅ — إذا تريد تضيف فيديو، سمّي الملف بالضبط:
        <div style="display:flex; gap:6px; margin-top:6px;">
          <input readonly value="${fname}" style="flex:1; direction:ltr; font-family:monospace;" onclick="this.select()">
          <button type="button" id="copyNewReelFilename" style="background:#eee; color:#333; border:none; padding:8px 14px; border-radius:8px; cursor:pointer; white-space:nowrap;">نسخ</button>
        </div>`;
      const copyBtn = document.getElementById('copyNewReelFilename');
      if(copyBtn) copyBtn.addEventListener('click', async ()=>{
        try{ await navigator.clipboard.writeText(fname); }
        catch(e){ const inp = copyBtn.previousElementSibling; if(inp){ inp.select(); document.execCommand('copy'); } }
        copyBtn.textContent = 'انتسخ ✓';
        setTimeout(()=>{ copyBtn.textContent='نسخ'; }, 1200);
      });
      document.getElementById('newReelCaption').value='';
      document.getElementById('newReelVideo').value='';
      document.getElementById('newReelProduct').value='';
      renderList();
    }catch(e){ msg.className='err'; msg.textContent = 'صار خطأ: ' + (e.code||e.message); }
  });
}


function renderBanners(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="hint">
      هنا تدير لوحة الإعلانات اللي تطلع بأعلى الشاشة الرئيسية بالتطبيق. ارفع صورة (الأفضل عرضية بنسبة 16:9)، وإذا ضفت أكثر من صورة تتبدل تلقائياً. تكدر تحدد فترة ظهور لكل إعلان (من/إلى) أو توقفه مؤقتاً. إذا ماكو أي إعلان فعّال، يطلع الإعلان الافتراضي.
    </div>
    <div id="bannersList"></div>
    <div class="card">
      <b>إعلان جديد</b>
      <div class="field"><label>صورة الإعلان</label><input type="file" id="newBnFile" accept="image/*"></div>
      <div class="field"><label>رابط عند الضغط (اختياري)</label><input type="text" id="newBnLink" placeholder="https://..."></div>
      <div class="field"><label>يظهر من تاريخ (اختياري)</label><input type="date" id="newBnFrom"></div>
      <div class="field"><label>إلى تاريخ (اختياري)</label><input type="date" id="newBnTo"></div>
      <button class="addBtn" id="newBnBtn">+ إضافة الإعلان</button>
      <div id="bnMsg" style="font-size:13px; text-align:center; margin-top:8px; min-height:18px;"></div>
    </div>`;
  function renderList(){
    const el = document.getElementById('bannersList');
    el.innerHTML = bannersData.length ? bannersData.map(b=>`
      <div class="card">
        <img src="${b.image}" style="width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:12px;">
        <div class="row">
          <span style="font-size:12px;">${b.from||b.to ? ('الفترة: '+(b.from||'—')+' ← '+(b.to||'—')) : 'بدون فترة محددة'}</span>
          <span class="badge ${b.active===false?'out':'ok'}">${b.active===false?'متوقف':'فعّال'}</span>
        </div>
        <div class="row">
          <button data-bn-up="${b.id}" style="padding:6px 12px;">▲</button>
          <button data-bn-down="${b.id}" style="padding:6px 12px;">▼</button>
          <button data-bn-toggle="${b.id}" style="padding:6px 12px;">${b.active===false?'تفعيل':'إيقاف'}</button>
          <button data-bn-del="${b.id}" style="padding:6px 12px; color:#c0392b;">حذف</button>
        </div>
      </div>`).join('') : '<div class="card" style="text-align:center; opacity:.7;">ماكو إعلانات بعد — التطبيق يعرض الإعلان الافتراضي.</div>';
    async function saveOrder(){
      for(let i=0;i<bannersData.length;i++){
        bannersData[i].order = i;
        await db.collection('banners').doc(bannersData[i].id).set({order:i},{merge:true});
      }
    }
    el.querySelectorAll('[data-bn-up],[data-bn-down]').forEach(btn=>btn.addEventListener('click', async ()=>{
      const id = btn.dataset.bnUp || btn.dataset.bnDown;
      const i = bannersData.findIndex(x=>x.id===id);
      const j = btn.dataset.bnUp ? i-1 : i+1;
      if(j<0 || j>=bannersData.length) return;
      [bannersData[i], bannersData[j]] = [bannersData[j], bannersData[i]];
      renderList();
      try{ await saveOrder(); }catch(e){ alert('صار خطأ: '+(e.code||e.message)); }
    }));
    el.querySelectorAll('[data-bn-toggle]').forEach(btn=>btn.addEventListener('click', async ()=>{
      const b = bannersData.find(x=>x.id===btn.dataset.bnToggle);
      b.active = (b.active===false);
      try{ await db.collection('banners').doc(b.id).set({active:b.active},{merge:true}); }catch(e){ alert('صار خطأ: '+(e.code||e.message)); }
      renderList();
    }));
    el.querySelectorAll('[data-bn-del]').forEach(btn=>btn.addEventListener('click', async ()=>{
      if(!confirm('حذف هذا الإعلان؟')) return;
      const id = btn.dataset.bnDel;
      try{ await db.collection('banners').doc(id).delete(); bannersData = bannersData.filter(x=>x.id!==id); }catch(e){ alert('صار خطأ: '+(e.code||e.message)); }
      renderList();
    }));
  }
  renderList();
  document.getElementById('newBnBtn').addEventListener('click', async ()=>{
    const msg = document.getElementById('bnMsg');
    const f = document.getElementById('newBnFile').files[0];
    if(!f){ msg.style.color='#c0392b'; msg.textContent='اختر صورة أولاً'; return; }
    msg.style.color=''; msg.textContent='جاري الرفع...';
    try{
      const image = await imageToBase64(f, 900, 0.78);
      const id = 'bn_' + Date.now();
      const doc = { image, link: document.getElementById('newBnLink').value.trim(), from: document.getElementById('newBnFrom').value||'', to: document.getElementById('newBnTo').value||'', active:true, order: bannersData.length, createdAt: Date.now() };
      await db.collection('banners').doc(id).set(doc);
      bannersData.push({id, ...doc});
      msg.style.color='#1e8e4e'; msg.textContent='تمت الإضافة ✓';
      renderBanners();
    }catch(e){ msg.style.color='#c0392b'; msg.textContent='صار خطأ: ' + (e.code||e.message); }
  });
}

function genGalCode(){ return 'GIFT-' + Math.random().toString(36).slice(2,8).toUpperCase(); }
function renderGalPhotos(){
  const main = document.getElementById('main');
  const statusLabel = { pending:'بانتظار المراجعة', approved:'منشورة', rejected:'مرفوضة' };
  const statusClass = { pending:'', approved:'ok', rejected:'out' };
  main.innerHTML = `
    <div class="hint">هنا تراجع صور الزبائن المرسلة من التطبيق — وافق عليها عشان تظهر بمعرض "صور من زبائننا"، وتكدر ترسل مكافأة يدوية (كود خصم) لأي زبون عجبتك صورته.</div>
    <div id="galPhotosList"></div>`;
  function renderList(){
    document.getElementById('galPhotosList').innerHTML = galPhotosData.map(g=>{
      const p = products.find(pp=>pp.id===g.productId);
      const status = g.status || 'pending';
      return `
      <div class="card">
        <div style="display:flex; gap:10px;">
          ${g.image?`<img src="${g.image}" style="width:80px; height:80px; object-fit:cover; border-radius:12px;">`:''}
          <div style="flex:1;">
            <b>${g.name||'زبون'}</b>
            <span class="badge ${statusClass[status]||''}">${statusLabel[status]||status}</span>
            <div style="font-size:12px; opacity:.8; margin-top:4px;">${g.caption||''}</div>
            <div style="font-size:11px; opacity:.65; margin-top:4px;">${p?('المنتج: '+p.name):'بدون منتج محدد'}</div>
          </div>
        </div>
        <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
          ${status!=='approved'?`<button class="save" data-approve-gal="${g.id}">موافقة ونشر</button>`:''}
          ${status!=='rejected'?`<button data-reject-gal="${g.id}" style="background:#eee; color:#333; border:none; padding:8px 14px; border-radius:8px; cursor:pointer;">رفض</button>`:''}
          <button data-del-gal="${g.id}" style="background:none; border:none; color:#c0392b; cursor:pointer;">حذف</button>
          ${g.rewardedCode?`<span style="font-size:11.5px; color:#2e7d32;">🎁 أُرسلت مكافأة: ${g.rewardedCode}</span>`:`<button data-reward-gal="${g.id}" style="background:#fff3cd; color:#856404; border:none; padding:8px 14px; border-radius:8px; cursor:pointer;">🎁 إرسال مكافأة</button>`}
        </div>
      </div>`;
    }).join('') || '<div class="empty">ماكو صور مرسلة بعد</div>';

    document.getElementById('galPhotosList').querySelectorAll('[data-approve-gal]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const id = b.dataset.approveGal;
        await db.collection('customerPhotos').doc(id).set({status:'approved'}, {merge:true});
        galPhotosData.find(x=>x.id===id).status = 'approved';
        renderList();
      });
    });
    document.getElementById('galPhotosList').querySelectorAll('[data-reject-gal]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const id = b.dataset.rejectGal;
        await db.collection('customerPhotos').doc(id).set({status:'rejected'}, {merge:true});
        galPhotosData.find(x=>x.id===id).status = 'rejected';
        renderList();
      });
    });
    document.getElementById('galPhotosList').querySelectorAll('[data-del-gal]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if(!confirm('حذف هذه الصورة نهائيًا؟')) return;
        const id = b.dataset.delGal;
        await db.collection('customerPhotos').doc(id).delete();
        galPhotosData = galPhotosData.filter(x=>x.id!==id);
        renderList();
      });
    });
    document.getElementById('galPhotosList').querySelectorAll('[data-reward-gal]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const id = b.dataset.rewardGal;
        const g = galPhotosData.find(x=>x.id===id);
        const amountStr = prompt('قيمة الخصم بالدولار (مثال: 5)', '5');
        if(!amountStr) return;
        const amount = Number(amountStr);
        if(!amount || amount<=0){ alert('رقم غير صحيح'); return; }
        const code = genGalCode();
        try{
          await db.doc(`discountCodes/${code}`).set({amount, used:false, forUid:g.uid, createdAt:Date.now(), reason:'photo_reward'});
          await db.collection('customerPhotos').doc(id).set({rewardedCode:code}, {merge:true});
          g.rewardedCode = code;
          renderList();
        }catch(e){ alert('صار خطأ: ' + (e.code||e.message)); }
      });
    });
  }
  renderList();
}

      stockData[id] = {...(stockData[id]||{}), images:updated};
      renderStock();
    }catch(err){ alert('صار خطأ برفع الصورة: ' + (err.code||err.message)); }
  }));
  main.querySelectorAll('[data-del-extra]').forEach(b=>b.addEventListener('click', async ()=>{
    const [id, idxStr] = b.dataset.delExtra.split(':');
    const idx = Number(idxStr);
    const current = [...((stockData[id]&&stockData[id].images)||[])];
    current.splice(idx,1);
    try{
      await db.collection('products').doc(id).set({images:current}, {merge:true});
      stockData[id] = {...(stockData[id]||{}), images:current};
      renderStock();
    }catch(err){ alert('صار خطأ: ' + (err.code||err.message)); }
  }));
}

const ORDER_STATUSES = ["قيد التجهيز","تم الشحن","تم التسليم"];
function renderOrders(){
  const main = document.getElementById('main');
  if(ordersData.length===0){ main.innerHTML = '<div class="empty">ماكو طلبات لحد الآن</div>'; return; }
  main.innerHTML = ordersData.slice(0,100).map((o,idx)=>{
    const date = o.createdAt ? new Date(o.createdAt).toLocaleString('ar') : '';
    const itemsList = o.itemsDetail ? o.itemsDetail.map(it=>`${it.name}${it.size?' ('+it.size+')':''} × ${it.qty}`).join('، ')
      : (o.items ? Object.entries(o.items).map(([id,q])=>{
          const p = products.find(pr=>pr.id===id);
          return `${p?p.name:id} × ${q}`;
        }).join('، ') : '');
    const profit = o.total!=null && o.costTotal!=null ? (o.total - o.costTotal) : null;
    const status = o.status || 'قيد التجهيز';
    return `
    <div class="card">
      <div class="row"><h3>${o.name||'زبون'} · ${fmtIQD(o.total||0)}</h3><span class="sub">${date}</span></div>
      <div class="order-items">${itemsList}</div>
      ${profit!=null ? `<div class="sub">الربح التقريبي: ${fmtIQD(profit - (o.partnerCommission||0))}</div>` : ''}
      ${o.partnerCode ? `<div class="sub">🤝 شريك ${o.partnerCode} · عمولته ${fmtIQD(o.partnerCommission||0)}</div>` : ''}
      <div class="field" style="margin-top:8px;">
        <label>حالة الطلب</label>
        <select data-order-status="${idx}">${ORDER_STATUSES.map(s=>`<option value="${s}" ${s===status?'selected':''}>${s}</option>`).join('')}</select>
      </div>
    </div>`;
  }).join('');
  main.querySelectorAll('[data-order-status]').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const idx = Number(sel.dataset.orderStatus);
      const order = ordersData[idx];
      if(!order._path) return;
      try{
        await db.doc(order._path).set({status: sel.value}, {merge:true});
        order.status = sel.value;
        if(order.partnerCode){ try{ await db.doc(`partners/${order.partnerCode}/sales/${order._path.split('/').pop()}`).set({status: sel.value}, {merge:true}); }catch(e){} }
        if(order.uid){
          try{
            await db.collection('notifications').add({uid:order.uid, type:'order', title:'تحديث حالة طلبك', body:`طلبك الآن: ${sel.value}`, orderId:order._path||null, createdAt:Date.now()});
          }catch(e){}
        }
      }catch(e){ alert('صار خطأ بتحديث الحالة'); }
    });
  });
}

function partnerStats(p){
  const mine = ordersData.filter(o=>o.partnerCode===p.id);
  let sales=0, confirmed=0, pending=0;
  mine.forEach(o=>{
    sales += o.total||0;
    const com = o.partnerCommission||0;
    if(o.status==='تم التسليم') confirmed += com; else pending += com;
  });
  const paid = p.paid||0;
  return {mine, count:mine.length, sales, confirmed, pending, paid, balance: confirmed-paid};
}
function genPartnerCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  for(let t=0;t<20;t++){
    let s=''; for(let i=0;i<5;i++) s+=chars[Math.floor(Math.random()*chars.length)];
    if(!partnersData.find(p=>p.id===s)) return s;
  }
  return 'P'+Date.now().toString(36).toUpperCase();
}

      </div>
      <div class="field" id="spStockOptWrap" style="display:none;">
        <label><input type="checkbox" id="spAddStock" checked> أضف الكمية للمخزون تلقائيًا</label><br>
        <label><input type="checkbox" id="spUpdateCost" checked> حدّث سعر تكلفة المنتج لهذا السعر</label>
      </div>
      <div class="field">
        <label>ملاحظات (اختياري)</label>
        <input id="spNotes" placeholder="مثال: دفعة مقدمة، شحنة متأخرة...">
      </div>
      <button class="addBtn" id="spSubmit" style="margin-top:8px;">تسجيل عملية الشراء</button>
      <div id="spMsg"></div>
    </div>
    <div id="spList"></div>`;

  function refreshCustomVisibility(){
    const val = document.getElementById('spProduct').value;
    document.getElementById('spCustomNameWrap').style.display = val ? 'none' : '';
    document.getElementById('spStockOptWrap').style.display = val ? '' : 'none';
  }
  document.getElementById('spProduct').addEventListener('change', refreshCustomVisibility);
  refreshCustomVisibility();

  // ===== قوائم الموردين (أسعار جاهزة لكل شركة، 3 مستويات بالدولار) =====
  // يحاول يتعرف على أعمدة أي ملف إكسل/CSV مستورد بغض النظر عن ترتيبها، بالاعتماد على كلمات بعناوين الأعمدة
  function guessColumns(headerRow){
    const norm = s => String(s||'').trim();
    const idx = {code:-1, name:-1, priceKilo:-1, priceQuarter:-1, price100g:-1};
    headerRow.forEach((h,i)=>{
      const t = norm(h);
      if(!t) return;
      if(idx.name===-1 && (t.includes('صنف') || t.includes('اسم') || /name/i.test(t))) idx.name = i;
      else if(idx.code===-1 && (t==='ت' || t.includes('كود') || t.includes('رقم') || /code|no\.?$/i.test(t))) idx.code = i;
      else if(idx.priceKilo===-1 && t.includes('كيلو')) idx.priceKilo = i;
      else if(idx.priceQuarter===-1 && t.includes('ربع')) idx.priceQuarter = i;
      else if(idx.price100g===-1 && (t.includes('100') || t.includes('غرام'))) idx.price100g = i;
    });
    return idx;
  }
  function renderCatalogsCard(){
    document.getElementById('catalogsList').innerHTML = catalogsData.map(cat=>`
      <div style="margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid #eee;">
        <div class="row"><b>${cat.name}</b><span style="font-size:11px; color:var(--muted);">${(cat.items||[]).length} مادة</span><button data-del-catalog="${cat.id}" style="background:none; border:none; color:#c0392b; cursor:pointer; font-family:'Cairo';">حذف الشركة</button></div>
        <div id="catalogItems-${cat.id}" style="max-height:260px; overflow-y:auto; margin-top:6px;">
          ${(cat.items||[]).map((it,idx)=>`
            <div class="row" style="font-size:12px;">
              <span>${it.code?`<span style="color:var(--muted);">#${it.code}</span> `:''}${it.name}</span>
              <span style="display:flex; align-items:center; gap:8px; white-space:nowrap;">
                ${it.priceKilo!=null?`ك:${it.priceKilo}$`:''} ${it.priceQuarter!=null?`ر:${it.priceQuarter}$`:''} ${it.price100g!=null?`١٠٠غ:${it.price100g}$`:''}
                <button data-del-item="${cat.id}:${idx}" style="background:none; border:none; color:#c0392b; cursor:pointer; font-size:14px;">✕</button>
              </span>
            </div>`).join('') || '<div class="empty" style="padding:10px 0;">ماكو مواد بعد بهذه القائمة</div>'}
        </div>
        <div style="display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;">
          <input data-item-code="${cat.id}" placeholder="الكود (اختياري)" style="flex:0.6; min-width:70px; padding:8px; border-radius:8px; border:1px solid #ddd; font-family:'Cairo';">
          <input data-item-name="${cat.id}" placeholder="اسم المادة" style="flex:1.6; min-width:120px; padding:8px; border-radius:8px; border:1px solid #ddd; font-family:'Cairo';">
          <input data-item-kilo="${cat.id}" type="number" placeholder="سعر الكيلو $" style="flex:1; min-width:90px; padding:8px; border-radius:8px; border:1px solid #ddd; font-family:'Cairo';">
          <input data-item-quarter="${cat.id}" type="number" placeholder="سعر الربع $" style="flex:1; min-width:90px; padding:8px; border-radius:8px; border:1px solid #ddd; font-family:'Cairo';">
          <input data-item-100g="${cat.id}" type="number" placeholder="سعر 100غم $" style="flex:1; min-width:90px; padding:8px; border-radius:8px; border:1px solid #ddd; font-family:'Cairo';">
          <button data-add-item="${cat.id}" style="background:#eee; color:#333; border:none; border-radius:8px; padding:0 14px; cursor:pointer; font-size:16px;">➕</button>
        </div>
        <div class="field" style="margin-top:10px;">
          <label>استيراد دفعة كاملة من ملف إكسل/CSV (أعمدة: الكود، اسم الصنف، سعر الكيلو، سعر الربع، سعر 100 غرام — بأي ترتيب)</label>
          <input type="file" accept=".xlsx,.xls,.csv" data-import-file="${cat.id}">
          <div data-import-status="${cat.id}" style="font-size:12px; margin-top:4px;"></div>
        </div>
      </div>`).join('') || '<div class="empty">ماكو قوائم موردين بعد — أضف أول شركة تحت</div>';

    document.getElementById('catalogsList').querySelectorAll('[data-add-item]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const catId = b.dataset.addItem;
        const code = document.querySelector(`[data-item-code="${catId}"]`).value.trim();
        const name = document.querySelector(`[data-item-name="${catId}"]`).value.trim();
        const priceKilo = Number(document.querySelector(`[data-item-kilo="${catId}"]`).value)||null;
        const priceQuarter = Number(document.querySelector(`[data-item-quarter="${catId}"]`).value)||null;
        const price100g = Number(document.querySelector(`[data-item-100g="${catId}"]`).value)||null;
        if(!name || (!priceKilo && !priceQuarter && !price100g)){ alert('اكتب اسم المادة وسعر واحد على الأقل'); return; }
        const cat = catalogsData.find(c=>c.id===catId);
        cat.items = [...(cat.items||[]), {code, name, priceKilo, priceQuarter, price100g}];
        try{
          await db.collection('supplierCatalogs').doc(catId).set({name:cat.name, items:cat.items}, {merge:true});
          renderCatalogsCard();
          refreshSupplierPick();
        }catch(e){ alert('صار خطأ: ' + (e.code||e.message)); }
      });
    });
    document.getElementById('catalogsList').querySelectorAll('[data-del-item]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const [catId, idxStr] = b.dataset.delItem.split(':');
        const idx = Number(idxStr);
        const cat = catalogsData.find(c=>c.id===catId);
        cat.items = (cat.items||[]).filter((_,i)=>i!==idx);
        try{
          await db.collection('supplierCatalogs').doc(catId).set({name:cat.name, items:cat.items}, {merge:true});
          renderCatalogsCard();
          refreshSupplierPick();
        }catch(e){ alert('صار خطأ: ' + (e.code||e.message)); }
      });
    });
    document.getElementById('catalogsList').querySelectorAll('[data-del-catalog]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const catId = b.dataset.delCatalog;
        const cat = catalogsData.find(c=>c.id===catId);
        if(!confirm(`حذف قائمة "${cat.name}" بكل موادها؟`)) return;
        try{
          await db.collection('supplierCatalogs').doc(catId).delete();
          catalogsData = catalogsData.filter(c=>c.id!==catId);
          renderCatalogsCard();
          refreshSupplierPick();
        }catch(e){ alert('صار خطأ: ' + (e.code||e.message)); }
      });
    });
    document.getElementById('catalogsList').querySelectorAll('[data-import-file]').forEach(inp=>{
      inp.addEventListener('change', async e=>{
        const catId = inp.dataset.importFile;
        const file = e.target.files[0]; if(!file) return;
        const status = document.querySelector(`[data-import-status="${catId}"]`);
        status.className=''; status.textContent = 'جاري القراءة...';
        try{
          const buf = await file.arrayBuffer();
          const wb = XLSX.read(buf, {type:'array'});
          const cat = catalogsData.find(c=>c.id===catId);
          // إذا الملف فيه أكثر من ورقة (Sheet)، نحاول نلاقي الورقة اللي اسمها يطابق اسم هذا المورد،
          // ونتجنب أي ورقة اسمها "الكل" (غالبًا ورقة مجمّعة بعمود شركة إضافي بترتيب مختلف)
          let sheetName = wb.SheetNames[0];
          const normName = String(cat.name||'').trim();
          const matched = wb.SheetNames.find(n => n===normName || n.includes(normName) || normName.includes(n));
          if(matched) sheetName = matched;
          else if(wb.SheetNames.length > 1){
            const nonAll = wb.SheetNames.filter(n => !n.includes('الكل') && !/all/i.test(n));
            if(nonAll.length) sheetName = nonAll[0];
          }
          const sheet = wb.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
          if(!rows.length){ status.className='err'; status.textContent = 'الملف فاضي'; return; }
          // نفتش بأول 10 صفوف عن صف العناوين الحقيقي (تجاهل أي عنوان/وصف فوقه)
          let headerRowIdx = -1, col = null;
          for(let r=0; r<Math.min(10, rows.length); r++){
            const c = guessColumns(rows[r]);
            if(c.name!==-1){ headerRowIdx = r; col = c; break; }
          }
          if(!col){ status.className='err'; status.textContent = 'ما قدرت ألاقي عمود اسم الصنف بالملف (تأكد إنه فيه صف عناوين واضح)'; return; }
          const existing = cat.items || [];
          let added = 0;
          for(let r=headerRowIdx+1; r<rows.length; r++){
            const row = rows[r];
            const name = String((col.name>-1?row[col.name]:'')||'').trim();
            if(!name) continue;
            const code = col.code>-1 ? String(row[col.code]||'').trim() : '';
            const priceKilo = col.priceKilo>-1 ? (Number(row[col.priceKilo])||null) : null;
            const priceQuarter = col.priceQuarter>-1 ? (Number(row[col.priceQuarter])||null) : null;
            const price100g = col.price100g>-1 ? (Number(row[col.price100g])||null) : null;
            existing.push({code, name, priceKilo, priceQuarter, price100g});
            added++;
          }
          cat.items = existing;
          status.textContent = `جاري الحفظ بقاعدة البيانات (ورقة: ${sheetName})...`;
          await db.collection('supplierCatalogs').doc(catId).set({name:cat.name, items:cat.items}, {merge:true});
          status.className='ok'; status.textContent = `تم استيراد ${added} مادة ✅`;
          renderCatalogsCard();
          refreshSupplierPick();
        }catch(err){
          status.className='err'; status.textContent = 'صار خطأ بقراءة الملف: ' + (err.message||'غير معروف');
          console.error(err);
        }
      });
    });
  }
  renderCatalogsCard();

  document.getElementById('newCatalogSubmit').addEventListener('click', async ()=>{
    const name = document.getElementById('newCatalogName').value.trim();
    const msg = document.getElementById('newCatalogMsg');
    if(!name){ msg.className='err'; msg.textContent='اكتب اسم الشركة'; return; }
    if(catalogsData.some(c=>c.name===name)){ msg.className='err'; msg.textContent='هذه الشركة موجودة بالفعل بالأسفل'; return; }
    msg.className=''; msg.textContent='جاري الإضافة...';
    try{
      await db.collection('supplierCatalogs').doc(name).set({name, items:[]}, {merge:true});
      catalogsData.push({id:name, name, items:[]});
      catalogsData.sort((a,b)=>(a.name||'').localeCompare(b.name||'', 'ar'));
      document.getElementById('newCatalogName').value = '';
      msg.className='ok'; msg.textContent='تمت الإضافة ✅';
      renderCatalogsCard();
    }catch(e){ msg.className='err'; msg.textContent = 'صار خطأ: ' + (e.code||e.message); }
  });

  // يربط حقل "المورد" بقائمة الأسعار الجاهزة لنفس المورد (إذا موجودة)
  const tierLabel = {priceKilo:'كيلو', priceQuarter:'ربع', price100g:'100غم'};
  function fmtItemPrices(it){
    return ['priceKilo','priceQuarter','price100g'].filter(k=>it[k]!=null).map(k=>`${tierLabel[k]}:${it[k]}$`).join(' / ');
  }
  function refreshSupplierPick(){
    const typed = document.getElementById('spSupplier').value.trim();
    const cat = catalogsData.find(c=>(c.name||'').trim() === typed);
    const wrap = document.getElementById('spCatalogPickWrap');
    const pick = document.getElementById('spCatalogPick');
    if(cat && (cat.items||[]).length){
      wrap.style.display = '';
      pick.innerHTML = '<option value="">-- اختر مادة من القائمة --</option>' +
        cat.items.map((it,idx)=>`<option value="${idx}">${it.name} (${fmtItemPrices(it)})</option>`).join('');
    } else {
      wrap.style.display = 'none';
      pick.innerHTML = '<option value="">-- اختر مادة من القائمة --</option>';
      document.getElementById('spTierWrap').style.display = 'none';
      document.getElementById('spRateWrap').style.display = 'none';
    }
  }
  function recalcUnitCostFromCatalog(){
    const typed = document.getElementById('spSupplier').value.trim();
    const cat = catalogsData.find(c=>(c.name||'').trim() === typed);
    const idx = document.getElementById('spCatalogPick').value;
    const hint = document.getElementById('spUsdHint');
    if(!cat || idx===''){ return; }
    const item = cat.items[Number(idx)];
    if(!item) return;
    const tier = document.getElementById('spTier').value;
    const usdPrice = item[tier];
    const rate = Number(document.getElementById('spExchangeRate').value);
    if(usdPrice==null){ hint.textContent = 'ماكو سعر مسجل لهذه المادة بهذه الوحدة'; return; }
    if(rate>0){
      document.getElementById('spUnitCost').value = Math.round(usdPrice * rate);
      hint.textContent = `${usdPrice}$ × ${rate} = ${fmtIQD(usdPrice*rate)} لكل ${tierLabel[tier]}`;
    } else {
      hint.textContent = `السعر الأصلي: ${usdPrice}$ لكل ${tierLabel[tier]} — اكتب سعر الصرف فوق عشان يتحول للدينار تلقائيًا`;
    }
  }
  document.getElementById('spSupplier').addEventListener('input', refreshSupplierPick);
  document.getElementById('spCatalogPick').addEventListener('change', ()=>{
    const typed = document.getElementById('spSupplier').value.trim();
    const cat = catalogsData.find(c=>(c.name||'').trim() === typed);
    const idx = document.getElementById('spCatalogPick').value;
    const tierWrap = document.getElementById('spTierWrap');
    const rateWrap = document.getElementById('spRateWrap');
    if(!cat || idx===''){ tierWrap.style.display='none'; rateWrap.style.display='none'; return; }
    const item = cat.items[Number(idx)];
    if(!item) return;
    document.getElementById('spProduct').value = '';
    refreshCustomVisibility();
    document.getElementById('spCustomName').value = item.name;
    tierWrap.style.display = '';
    rateWrap.style.display = '';
    recalcUnitCostFromCatalog();
  });
  document.getElementById('spTier').addEventListener('change', recalcUnitCostFromCatalog);
  document.getElementById('spExchangeRate').addEventListener('input', recalcUnitCostFromCatalog);
  refreshSupplierPick();

  function renderList(){
    const sorted = [...supplyData].sort((a,b)=>(b.date||b.createdAt||0)-(a.date||a.createdAt||0));
    document.getElementById('spList').innerHTML = sorted.map(p=>`
      <div class="card">
        <div class="row">
          <h3>${p.itemName}</h3>
          <span class="badge ok">${fmtIQD(p.totalCost)}</span>
        </div>
        <div class="sub">${p.supplier || 'مورد غير محدد'} · ${p.date ? new Date(p.date).toLocaleDateString('ar') : ''}</div>
        <div class="order-items">الكمية: ${p.quantity} × ${fmtIQD(p.unitCost)}${p.notes ? ' — '+p.notes : ''}</div>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button data-del-supply="${p.id}" style="background:none; border:none; color:#c0392b; cursor:pointer;">حذف</button>
        </div>
      </div>`).join('') || '<div class="empty">ماكو عمليات شراء مسجلة بعد</div>';

    document.getElementById('spList').querySelectorAll('[data-del-supply]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if(!confirm('حذف عملية الشراء هذه؟ (ملاحظة: هذا ما يرجّع الكمية اللي انضافت للمخزون سابقًا)')) return;
        const id = b.dataset.delSupply;
        try{
          await db.collection('supplierPurchases').doc(id).delete();
          supplyData = supplyData.filter(x=>x.id!==id);
          renderList();
        }catch(e){ alert('صار خطأ: ' + (e.code||e.message)); }
      });
    });
  }
  renderList();

  document.getElementById('spSubmit').addEventListener('click', async ()=>{
    const supplier = document.getElementById('spSupplier').value.trim();
    const productId = document.getElementById('spProduct').value;
    const customName = document.getElementById('spCustomName').value.trim();
    const quantity = Number(document.getElementById('spQty').value);
    const unitCost = Number(document.getElementById('spUnitCost').value);
    const dateStr = document.getElementById('spDate').value;
    const notes = document.getElementById('spNotes').value.trim();
    const msg = document.getElementById('spMsg');

    const itemName = productId ? ((products.find(p=>p.id===productId)||{}).name || '') : customName;
    if(!itemName){ msg.className='err'; msg.textContent='اختر منتج أو اكتب اسم المادة'; return; }
    if(!quantity || quantity<=0){ msg.className='err'; msg.textContent='اكتب كمية صحيحة'; return; }
    if(!unitCost || unitCost<=0){ msg.className='err'; msg.textContent='اكتب سعر وحدة صحيح'; return; }

    const totalCost = quantity * unitCost;
    const dateMs = dateStr ? new Date(dateStr).getTime() : Date.now();
    const data = {supplier, productId: productId||null, itemName, quantity, unitCost, totalCost, notes, date:dateMs, createdAt:Date.now()};

    msg.className = ''; msg.textContent = 'جاري الحفظ...';
    try{
      const ref = await db.collection('supplierPurchases').add(data);
      supplyData.push({id:ref.id, ...data});

      if(productId){
        const addStock = document.getElementById('spAddStock').checked;
        const updateCost = document.getElementById('spUpdateCost').checked;
        if(addStock || updateCost){
          const current = stockData[productId] || {};
          const patch = {};
          if(addStock) patch.stock = (current.stock||0) + quantity;
          if(updateCost) patch.costPrice = unitCost;
          await db.collection('products').doc(productId).set(patch, {merge:true});
          stockData[productId] = {...current, ...patch};
          const p = products.find(pp=>pp.id===productId);
          if(p && updateCost) p.costPrice = unitCost;
        }
      }

      msg.className = 'ok'; msg.textContent = 'تم تسجيل عملية الشراء ✅';
      document.getElementById('spQty').value = '1';
      document.getElementById('spUnitCost').value = '';
      document.getElementById('spCustomName').value = '';
      document.getElementById('spNotes').value = '';
      renderList();
    }catch(e){
      msg.className = 'err'; msg.textContent = 'صار خطأ: ' + (e.code || e.message || 'غير معروف');
      console.error(e);
    }
  });
}

function renderCustomers(){
  const main = document.getElementById('main');
  if(customersData.length===0){ main.innerHTML = '<div class="empty">ماكو زبائن مسجلين لحد الآن</div>'; return; }
  const sorted = [...customersData].sort((a,b)=>(b.totalSpent||0)-(a.totalSpent||0));
  main.innerHTML = sorted.map(c=>{
    const vip = (c.totalSpent||0) >= 200000;
    return `
    <div class="card">
      <div class="row">
        <h3>${c.name}</h3>
        ${vip?'<span class="badge vip">VIP</span>':''}
      </div>
      <div class="sub">إجمالي المشتريات: ${fmtIQD(c.totalSpent||0)}</div>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
